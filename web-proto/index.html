<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idle RNG Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout: one-screen mobile game. HUD strip, battle canvas, scrolling tab panel, bottom tab bar. Single dusk theme by choice. */
:root {
  color-scheme: dark;
  --bg: #15131f;
  --panel: #1e1b2c;
  --raised: #2a2640;
  --line: #3a3554;
  --fg: #ece8f6;
  --muted: #9a93b5;
  --gold: #f2c14e;
  --gem: #6fd3e8;
  --good: #7bd88f;
  --bad: #ff6b6b;
  --t-c: #a7a3b8;
  --t-r: #5aa2ff;
  --t-e: #b57bff;
  --t-l: #ffa53d;
  --t-m: #ff4f8b;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; background: var(--bg); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* HUD */
#hud { padding-block: 10px 8px; display: grid; grid-template-columns: 1fr auto auto; gap: 6px 14px; align-items: center; background: var(--panel); border-bottom: 1px solid var(--line); }
#hud .stage { font-family: var(--font-display); font-size: 20px; letter-spacing: .02em; }
#hud .stage small { font-family: var(--font-body); font-size: 12px; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.cur { display: flex; align-items: center; gap: 6px; font-weight: 800; }
.coin, .gem { width: 12px; height: 12px; display: inline-block; flex: none; }
.coin { background: var(--gold); border-radius: 50%; box-shadow: inset -2px -2px 0 #b8862a; }
.gem { background: var(--gem); transform: rotate(45deg) scale(.85); box-shadow: inset -2px -2px 0 #2f8fa8; }
#hud .sub { grid-column: 1 / -1; display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; gap: 8px; flex-wrap: wrap; }
#hud .sub b { color: var(--fg); font-weight: 700; }

/* Battle */
#battle { position: relative; flex: none; height: 210px; background: #1a1730; }
#cv { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
#bossbtn { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 10px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--bad); background: rgba(21,19,31,.85); font-weight: 800; font-size: 13px; cursor: pointer; }
#bossbtn.ok { border-color: var(--good); color: var(--good); }
#speedtag { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 10px; font-family: var(--font-display); font-size: 13px; color: var(--gem); background: rgba(21,19,31,.75); padding: 3px 8px; border-radius: 6px; }

/* Panel */
#panel { flex: 1; overflow-y: auto; padding-block: 14px 24px; -webkit-overflow-scrolling: touch; min-height: 0; }
#panel h2 { font-family: var(--font-display); font-size: 18px; margin: 0; letter-spacing: .02em; font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }

.btn { border: 1px solid var(--line); background: var(--raised); border-radius: 9px; padding: 10px 12px; font-weight: 800; cursor: pointer; text-align: left; line-height: 1.2; }
.btn:focus-visible, .tab:focus-visible, .hslot:focus-visible, .htile:focus-visible { outline: 2px solid var(--gem); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: #3b2f6b; border-color: #6b55c9; }
.btn.goldb { background: #4a3a14; border-color: #a17f2b; }
.btn small { display: block; font-weight: 600; color: var(--muted); font-size: 12px; margin-top: 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* Multipliers strip */
.mults { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mults div { background: var(--raised); border-radius: 8px; padding: 8px 6px; text-align: center; min-width: 0; }
.mults b { display: block; font-family: var(--font-display); font-size: 16px; font-weight: 500; }
.mults span { font-size: 11px; color: var(--muted); }

/* Gear */
.gslot { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.gicon { width: 44px; height: 44px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-display); font-size: 13px; color: #15131f; font-weight: 700; }
.gslot .meta { min-width: 0; }
.gslot .meta b { display: block; }
.gslot .btn { padding: 8px 10px; text-align: center; min-width: 96px; }
.r-C { background: var(--t-c); } .r-R { background: var(--t-r); } .r-E { background: var(--t-e); } .r-L { background: var(--t-l); } .r-M { background: var(--t-m); }
.c-C { color: var(--t-c); } .c-R { color: var(--t-r); } .c-E { color: var(--t-e); } .c-L { color: var(--t-l); } .c-M { color: var(--t-m); }
.empty-icon { background: var(--raised); color: var(--muted); }

/* Heroes */
.party { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.hslot, .htile { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 9px; border: 2px solid var(--line); background: var(--raised); padding: 0; cursor: pointer; overflow: hidden; }
.hslot canvas, .htile canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.hslot .lv, .htile .lv { position: absolute; right: 2px; bottom: 1px; font-family: var(--font-display); font-size: 11px; background: rgba(21,19,31,.8); padding: 0 3px; border-radius: 4px; }
.hslot.emptys { display: grid; place-items: center; color: var(--muted); font-size: 18px; }
.roster { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.htile.unowned { opacity: .28; }
.htile.sel, .hslot.sel { border-color: var(--fg); }
.htile.inparty::after { content: ""; position: absolute; left: 3px; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.b-C { border-color: color-mix(in srgb, var(--t-c) 55%, var(--line)); }
.b-R { border-color: color-mix(in srgb, var(--t-r) 70%, var(--line)); }
.b-E { border-color: color-mix(in srgb, var(--t-e) 75%, var(--line)); }
.b-L { border-color: var(--t-l); }
.b-M { border-color: var(--t-m); }
.tierhead { font-family: var(--font-display); font-size: 13px; margin: 4px 0 -4px; }
.detail { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
.detail canvas { width: 64px; height: 64px; image-rendering: pixelated; border-radius: 10px; background: var(--raised); }
.bar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 700; font-size: 13px; }
.toggle input { width: 18px; height: 18px; accent-color: #6b55c9; }

/* Summon */
.pitybar { height: 10px; border-radius: 5px; background: var(--raised); position: relative; overflow: hidden; }
.pitybar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--t-e), var(--t-l)); }
.pitybar s { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); opacity: .6; }
.banner { background: radial-gradient(120% 140% at 85% 0%, #4b2f7a 0%, #241d3b 55%, var(--panel) 100%); border: 1px solid #5a47a0; border-radius: 12px; padding: 14px; }
.banner h2 { font-size: 22px !important; }
table.rates { width: 100%; border-collapse: collapse; font-size: 13px; }
table.rates td, table.rates th { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: right; }
table.rates td:first-child, table.rates th:first-child { text-align: left; }

/* Reveal overlay */
#reveal { position: fixed; inset: 0; background: rgba(10,8,18,.92); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#reveal .cards { display: grid; grid-template-columns: repeat(5, minmax(0, 76px)); gap: 8px; justify-content: center; width: 100%; }
#reveal .cards.one { grid-template-columns: minmax(0, 140px); }
.rcard { aspect-ratio: 3 / 4; border-radius: 10px; border: 2px solid var(--line); background: var(--raised); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; transform: scale(.6); opacity: 0; transition: transform .25s ease-out, opacity .2s; overflow: hidden; }
.rcard.on { transform: scale(1); opacity: 1; }
.rcard canvas { width: 78%; image-rendering: pixelated; }
.rcard .nm { font-size: 10px; font-weight: 800; text-align: center; line-height: 1.1; }
.rcard .tag { position: absolute; top: 3px; left: 3px; font-family: var(--font-display); font-size: 10px; padding: 0 3px; border-radius: 3px; background: var(--good); color: #15131f; }
.rcard .tag.up { background: var(--gold); }
.rcard.glow-L { box-shadow: 0 0 18px var(--t-l); } .rcard.glow-M { box-shadow: 0 0 24px var(--t-m); } .rcard.glow-E { box-shadow: 0 0 10px var(--t-e); }
#reveal .hint { color: var(--muted); font-size: 13px; }

/* Modal (welcome back, class) */
#modal { position: fixed; inset: 0; background: rgba(10,8,18,.8); z-index: 40; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-left, 0px)); }
#modal .card { max-width: 360px; width: 100%; display: flex; flex-direction: column; gap: 10px; }
#modal h3 { font-family: var(--font-display); font-size: 22px; margin: 0; font-weight: 700; }

/* Toasts */
#toasts { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding-inline: 16px; }
.toast { background: var(--raised); border: 1px solid var(--line); padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; max-width: 100%; box-shadow: 0 6px 20px rgba(0,0,0,.4); animation: tin .2s ease-out; }
.toast.good { border-color: var(--good); } .toast.bad { border-color: var(--bad); } .toast.gold { border-color: var(--gold); }
@keyframes tin { from { transform: translateY(-6px); opacity: 0; } }

/* Daily */
.quest { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
.quest .btn { padding: 7px 10px; text-align: center; }
.log { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--raised); padding: 8px 12px; font-weight: 800; cursor: pointer; }
.seg button.on { background: #3b2f6b; color: var(--fg); }
.seg button + button { border-left: 1px solid var(--line); }

/* Tabs */
#tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--panel); border-top: 1px solid var(--line); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { border: 0; background: none; padding: 10px 2px 12px; font-family: var(--font-display); font-size: 14px; color: var(--muted); cursor: pointer; position: relative; }
.tab.on { color: var(--fg); }
.tab.on::before { content: ""; position: absolute; left: 25%; right: 25%; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--gold); }
.tab .dot { position: absolute; top: 7px; right: calc(50% - 26px); width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }

@media (prefers-reduced-motion: reduce) { .rcard { transition: none; } .toast { animation: none; } }
</style>
</head>
<body>

<div id="app">
  <header id="hud" class="gut">
    <div class="stage" id="h-stage">Stage 1</div>
    <div class="cur num"><span class="coin"></span><span id="h-gold">0</span></div>
    <div class="cur num"><span class="gem"></span><span id="h-gems">0</span></div>
    <div class="sub num"><span>DPS <b id="h-dps">10</b></span><span id="h-class">Recruit</span><span id="h-day">Day 1</span></div>
  </header>
  <section id="battle" aria-label="Battle">
    <canvas id="cv"></canvas>
    <span id="speedtag" hidden></span>
    <button id="bossbtn" hidden>Retry boss</button>
  </section>
  <main id="panel" class="gut"></main>
  <nav id="tabs">
    <button class="tab on" data-tab="up">Upgrade</button>
    <button class="tab" data-tab="gear">Gear</button>
    <button class="tab" data-tab="heroes">Heroes</button>
    <button class="tab" data-tab="summon">Summon</button>
    <button class="tab" data-tab="daily">Daily</button>
  </nav>
</div>
<div id="toasts"></div>
<div id="modal" hidden></div>
<div id="reveal" hidden></div>

<script>
"use strict";
// ---------------- Constants (specs/00 section 2) ----------------
const C = {
  TICK: 0.1, ATTACK_TICKS: 10, SPAWN_TICKS: 5, BASE_ATK: 10,
  HP0: 20, HP_G: 1.07, KILLS: 10, BOSS_EVERY: 10, BOSS_HP: 10, BOSS_TICKS: 200, BOSS_GOLD: 3,
  GOLD0: 2, GOLD_G: 1.05, STAT_PER: 0.05, STAT_C0: 50, STAT_CG: 1.07,
  PULL: 100, FREE_PER_DAY: 3, DAY: 86400, LOGIN: 50, QUEST: 30, FIRST_CLEAR: 10,
  CHEST_H: 4, CHEST_GEMS: 50, TUT_GEMS: 1000, TUT_PULLS: 10, OFF_RATE: 0.5, OFF_CAP_H: 8,
  GEAR_DROP: 0.005, GEAR_BOSS_DROP: 0.10, TIER_W: 10, GEAR_G: 1.0074,
  ENH_MAX: 15, ENH_PER: 0.05, ENH_FLOOR: 0.30, ENH_STEP: 0.05, ENH_COST: 20, SELL_KILLS: 5,
  PITY_SOFT: 50, PITY_STEP: 0.0325, PITY_HARD: 80, BASE_LPLUS: 0.03, M_SHARE: 1/6,
  HERO_SLOTS: 6, LVL_CUM: [1,3,6,10,16,25,40,64,100,160], LVL_BONUS: 0.20,
  CLASS_STAGES: [50,150,300,500], CLASS_MULT: 1.5,
};
const TIERS = ["C","R","E","L","M"];
const TIER_NAME = {C:"Common",R:"Rare",E:"Epic",L:"Legendary",M:"Mythic"};
const RATES = {C:.60,R:.28,E:.09,L:.025,M:.005};
const RARITY_MULT = {C:1,R:1.2,E:1.5,L:2,M:3};
const HERO_PCT = {C:10,R:20,E:40,L:80,M:160};
const SHARD = {C:1,R:5,E:25,L:100,M:500};
const SLOTS = ["Weapon","Helm","Chest","Gloves","Boots","Ring"];
const CLASSES = ["Recruit","Squire","Knight","Paladin","Champion"];

const HERO_NAMES = {
  C: ["Pell the Farmhand","Doss the Woodcutter","Mira the Scout","Tobb the Miller","Kesh the Slinger","Wren the Archer","Hollis the Guard","Bree the Herbalist","Garr the Smith","Lio the Fisher","Nim the Courier","Osk the Porter","Fen the Trapper","Rook the Sentry","Tamsin the Cook","Ulf the Brawler","Vesna the Spearmaiden","Juno the Lamplighter","Pip the Squire","Corra the Shepherd"],
  R: ["Alder the Ranger","Isolde the Duelist","Marek the Pikeman","Sable the Rogue","Thane the Berserker","Yara the Falconer","Brom the Shieldwall","Celes the Acolyte","Dax the Gunner","Elowen the Druid","Faro the Lancer","Greta the Alchemist","Hale the Monk","Ivo the Bard","Kaya the Huntress"],
  E: ["Seraphine the Spellblade","Vorn the Warlock","Lysa the Stormcaller","Orrin the Templar","Nyx the Shadowdancer","Calder the Frostknight","Mei the Sage","Rhea the Valkyrie","Taro the Ronin","Zephyr the Windwalker"],
  L: ["Aurelia the Sunblade","Morgrim the Dragonbane","Kael the Starforged","Ishara the Oracle","Dravik the Bloodlord","Solenne the Lightbringer"],
  M: ["Eon the Timeless","Vael the Void Empress","Ragnor the World-Ender"],
};
const HEROES = []; const HERO_BY_ID = {}; const POOL = {};
for (const t of TIERS) { POOL[t] = []; HERO_NAMES[t].forEach((n, i) => { const id = t + String(i + 1).padStart(2, "0"); const h = { id, tier: t, name: n, short: n.split(" ")[0] }; HEROES.push(h); HERO_BY_ID[id] = h; POOL[t].push(id); }); }

// ---------------- Formulas ----------------
const powi = (b, n) => Math.pow(b, n);
const HP = s => C.HP0 * powi(C.HP_G, s);
const GOLD = s => C.GOLD0 * powi(C.GOLD_G, s);
const statCost = n => C.STAT_C0 * powi(C.STAT_CG, n);
const gearTier = s => Math.floor(s / C.TIER_W) * C.TIER_W;
const gearBase = p => (powi(C.GEAR_G, p.t) - 1) * RARITY_MULT[p.r];
const gearEff = p => gearBase(p) * (1 + C.ENH_PER * p.e);
const enhChance = l => Math.max(C.ENH_FLOOR, 1 - C.ENH_STEP * l);
const enhCost = () => C.ENH_COST * GOLD(S.stage);
const sellValue = p => C.SELL_KILLS * GOLD(p.t) * RARITY_MULT[p.r];
const heroLevel = c => C.LVL_CUM.filter(x => c >= x).length;
const heroPct = id => { const c = S.heroes[id] || 0; if (!c) return 0; return HERO_PCT[HERO_BY_ID[id].tier] * (1 + C.LVL_BONUS * (heroLevel(c) - 1)); };
const pityRate = n => n >= C.PITY_HARD ? 1 : Math.min(1, C.BASE_LPLUS + C.PITY_STEP * Math.max(0, n - C.PITY_SOFT));

function statMult() { return 1 + C.STAT_PER * S.statLvl; }
function gearMult() { let m = 1; for (const p of S.gear) if (p) m *= 1 + gearEff(p); return m; }
function heroMult() { let s = 0; for (const id of S.party) if (id) s += heroPct(id); return 1 + s / 100; }
function classMult() { return powi(C.CLASS_MULT, S.classes); }
function dps() { return C.BASE_ATK * statMult() * gearMult() * heroMult() * classMult(); }
function killSeconds(s, boss) { const hits = Math.max(1, Math.ceil(HP(s) * (boss ? C.BOSS_HP : 1) / dps())); return hits * C.ATTACK_TICKS * C.TICK + C.SPAWN_TICKS * C.TICK; }

// ---------------- Number formatting ----------------
const UNITS = ["K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];
function fmt(n) {
  if (!isFinite(n)) return "∞";
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : String(Math.floor(n));
  let v = n, i = -1;
  while (v >= 1000 && i < UNITS.length - 1) { v /= 1000; i++; }
  if (v >= 1000) return n.toExponential(2).replace("+", "");
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0)) + UNITS[i];
}
const xm = v => v < 1000 ? v.toFixed(2) : fmt(v);
const pct = (x, d = 1) => (x * 100).toFixed(d) + "%";
function dur(sec) { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? `${h}h ${m}m` : m ? `${m}m ${s}s` : `${s}s`; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------------- State ----------------
const SAVE_KEY = "idle-rng-proto-v1";
let S;
function newState() {
  return {
    v: 1, clock: 0, stage: 1, kills: 0, boss: "none", bossFails: 0,
    enemy: null, spawn: C.SPAWN_TICKS, atk: C.ATTACK_TICKS,
    gold: 0, gems: C.TUT_GEMS, shards: 0, statLvl: 0,
    gear: [null, null, null, null, null, null],
    heroes: {}, party: [null, null, null, null, null, null], autoParty: true,
    pity: 0, totalPulls: 0, freeToday: C.FREE_PER_DAY, freeBanked: C.TUT_PULLS,
    dayKey: 0, q: { kills: 0, boss: 0, pulls: 0, claimed: [false, false, false] },
    chestStart: 0, bestBoss: 0, classes: 0,
    life: { kills: 0, bosses: 0, drops: 0, lplus: 0, fails: 0 },
    log: [], lastReal: Date.now(), speed: 1,
  };
}
function load() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { const s = JSON.parse(raw); if (s && s.v === 1) return s; } } catch (e) {}
  return null;
}
function save() { try { S.lastReal = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

// ---------------- Events for UI ----------------
const fx = { hits: [], lunge: 0, flash: 0, partyFlash: 0, shake: 0 };
let suppressFx = false;
function log(msg) { S.log.unshift(dayStamp() + "  " + msg); if (S.log.length > 40) S.log.length = 40; }

}

  }

  if (e.isBoss) {
    e.timer--;
    if (e.timer <= 0 && e.hp > 0) { bossFail(); return; }
  }
  if (--S.atk <= 0) {
    S.atk = C.ATTACK_TICKS;
    const dmg = dps();
    e.hp -= dmg;
    if (!suppressFx) { fx.lunge = 1; fx.partyFlash = 1; fx.hits.push({ v: dmg, t: 0, x: Math.random() * 30 - 15 }); if (fx.hits.length > 8) fx.hits.shift(); }

}

}

// ---------------- Gacha (specs/01) ----------------

  const dpsBefore = dps();

}
function autoParty() {
  const owned = HEROES.filter(h => S.heroes[h.id]).map(h => h.id);
  owned.sort((a, b) => heroPct(b) - heroPct(a) || (a < b ? -1 : 1));
  S.party = [0,1,2,3,4,5].map(i => owned[i] || null);
}

  const owned = HEROES.filter(h => S.heroes[h.id]).map(h => h.id).sort((a, b) => heroPct(b) - heroPct(a) || (a < b ? -1 : 1)).slice(0, 6);

// ---------------- Offline catch-up (specs/06) ----------------
function catchUp(seconds, real) {

  const capped = Math.min(seconds, C.OFF_CAP_H * 3600);
  const g = capped / killSeconds(S.stage, false) * GOLD(S.stage) * C.OFF_RATE;
  S.gold += g; S.clock += seconds;

  ctx.fillText(label, 12, 18);

  fx.lunge = Math.max(0, fx.lunge - decay); fx.flash = Math.max(0, fx.flash - decay); fx.partyFlash = Math.max(0, fx.partyFlash - decay * .7); fx.shake = Math.max(0, fx.shake - decay);
}

// ---------------- UI ----------------
let tab = "up", dirty = true, selHero = null, showRates = false, lastHtml = "";
const panel = document.getElementById("panel");
function hud() {
  document.getElementById("h-stage").innerHTML = `Stage ${S.stage}<small>${S.boss === "walled" ? "walled" : S.stage % 10 === 0 ? "boss" : ""}</small>`;
  document.getElementById("h-gold").textContent = fmt(S.gold);
  document.getElementById("h-gems").textContent = fmt(S.gems);
  document.getElementById("h-dps").textContent = fmt(dps());
  document.getElementById("h-class").textContent = CLASSES[S.classes];
  const t = S.clock % C.DAY;
  document.getElementById("h-day").textContent = `Day ${Math.floor(S.clock / C.DAY) + 1} · ${String(Math.floor(t / 3600)).padStart(2, "0")}:${String(Math.floor(t % 3600 / 60)).padStart(2, "0")}`;
  const bb = document.getElementById("bossbtn");
  bb.hidden = S.boss !== "walled";
  if (S.boss === "walled") {
    const need = HP(S.stage) * C.BOSS_HP / (C.BOSS_TICKS * C.TICK - 1) / dps();
    const ok = killSeconds(S.stage, true) - C.SPAWN_TICKS * C.TICK < C.BOSS_TICKS * C.TICK;
    bb.className = ok ? "ok" : "";
    bb.textContent = ok ? "Retry boss: clearable" : `Retry boss · need ~${Math.max(1, need).toFixed(1)}x DPS`;
  }
  const st = document.getElementById("speedtag"); st.hidden = S.speed === 1; st.textContent = `x${S.speed} speed`;
  // tab dots
  const dots = { daily: questReady() || chestReadyIn() <= 0, summon: canPull(1) && (S.freeBanked + S.freeToday > 0), heroes: !S.autoParty && partyWouldChange() };
  document.querySelectorAll(".tab").forEach(b => { const has = !!dots[b.dataset.tab]; let d = b.querySelector(".dot"); if (has && !d) { d = document.createElement("span"); d.className = "dot"; b.appendChild(d); } else if (!has && d) d.remove(); });
}
function questReady() { return QUESTS.some((q, i) => !S.q.claimed[i] && S.q[q.key] >= q.target); }

function renderPanel() {
  let html = "";
  if (tab === "up") html = viewUpgrade();
  else if (tab === "gear") html = viewGear();
  else if (tab === "heroes") html = viewHeroes();
  else if (tab === "summon") html = viewSummon();
  else html = viewDaily();
  if (html !== lastHtml) { panel.innerHTML = html; lastHtml = html; hydrateSprites(panel); }
}
function multsStrip() {
  return `<div class="mults num">
    <div><b>x${statMult().toFixed(2)}</b><span>ATK level</span></div>
    <div><b>x${xm(gearMult())}</b><span>Gear</span></div>
    <div><b>x${heroMult().toFixed(2)}</b><span>Heroes</span></div>
    <div><b>x${classMult().toFixed(2)}</b><span>Class</span></div></div>`;
}
function viewUpgrade() {
  const n = S.statLvl, c1 = statCost(n);
  let c10 = 0; for (let i = 0; i < 10; i++) c10 += statCost(n + i);
  const mx = maxStatPreview();
  const gain = m => pct((1 + C.STAT_PER * (n + m)) / (1 + C.STAT_PER * n) - 1);
  const killT = killSeconds(S.stage, false);
  const bossT = killSeconds(S.stage, true) - C.SPAWN_TICKS * C.TICK;
  const nextBoss = Math.ceil(S.stage / 10) * 10;
  const bossNextT = killSeconds(nextBoss, true) - C.SPAWN_TICKS * C.TICK;
  return `<div class="stack">
    <div class="spread"><h2>ATK level ${n}</h2><span class="muted num">x${statMult().toFixed(2)} ATK</span></div>
    <div class="stack" style="gap:8px">
      <button class="btn goldb" data-act="stat1" ${S.gold < c1 ? "disabled" : ""}>Buy 1 level<small class="num">${fmt(c1)} gold · +${gain(1)} DPS</small></button>
      <div class="grid2">
        <button class="btn goldb" data-act="stat10" ${S.gold < c10 ? "disabled" : ""}>Buy 10<small class="num">${fmt(c10)} gold · +${gain(10)}</small></button>
        <button class="btn goldb" data-act="statmax" ${mx.count === 0 ? "disabled" : ""}>Buy max<small class="num">${mx.count} levels · +${gain(mx.count)}</small></button>
      </div>
    </div>
    <div class="label">Power breakdown</div>
    ${multsStrip()}
    <div class="card stack small num" style="gap:6px">
      <div class="spread"><span class="muted">Normal enemy at stage ${S.stage}</span><span>${killT.toFixed(1)}s per kill</span></div>
      <div class="spread"><span class="muted">Gold per minute</span><span>${fmt(GOLD(S.stage) / killT * 60)}</span></div>
      <div class="spread"><span class="muted">Next boss (stage ${nextBoss})</span><span class="${bossNextT < 20 ? "" : "c-M"}">${bossNextT.toFixed(0)}s of 20s</span></div>
    </div>
    <p class="small muted" style="margin:0">DPS = 10 × ATK level × Gear × Heroes × Class. Gold grows slower than enemy HP, so gear and heroes have to carry you past boss walls.</p>
  </div>`;
}
function viewGear() {
  const cost = enhCost();
  const rows = S.gear.map((p, i) => {
    if (!p) return `<div class="gslot"><div class="gicon empty-icon">${SLOTS[i][0]}</div><div class="meta"><b>${SLOTS[i]}</b><span class="small muted">Empty. Drops come from enemies.</span></div><span></span></div>`;
    const base = gearBase(p), eff = gearEff(p);
    const maxed = p.e >= C.ENH_MAX;
    const lbl = p.t === 0 ? "T0 adds nothing" : maxed ? "Max level" : S.gold < cost ? `Need ${fmt(cost)}` : `Enhance ${pct(enhChance(p.e), 0)}`;
    return `<div class="gslot"><div class="gicon r-${p.r}">${p.r}${p.e ? "+" + p.e : ""}</div>
      <div class="meta"><b class="c-${p.r}">${TIER_NAME[p.r]} ${SLOTS[i]}</b><span class="small muted num">T${p.t} · +${fmt(eff * 100)}% ATK${p.e ? ` (base ${fmt(base * 100)}%)` : ""} · +${p.e}/${C.ENH_MAX}</span></div>
      <button class="btn" data-act="enh" data-i="${i}" ${maxed || S.gold < cost || p.t === 0 ? "disabled" : ""}>${lbl}</button></div>`;
  }).join("");
  return `<div class="stack">
    <div class="spread"><h2>Gear</h2><span class="muted num">x${xm(gearMult())} DPS</span></div>
    <div class="small muted num">Enhance costs ${fmt(cost)} gold per try at stage ${S.stage}. Failing keeps the level. A better drop replaces the piece and resets its enhancement.</div>
    <div class="stack" style="gap:8px">${rows}</div>
    <div class="label">Recent</div>
    <div class="log">${S.log.slice(0, 12).map(l => `<div>${esc(l)}</div>`).join("") || "<div>Nothing yet.</div>"}</div>
  </div>`;
}
function heroTile(id, extra = "") {
  const owned = !!S.heroes[id]; const h = HERO_BY_ID[id];
  const lv = owned ? heroLevel(S.heroes[id]) : 0;
  return `<button class="htile b-${h.tier} ${owned ? "" : "unowned"} ${S.party.includes(id) ? "inparty" : ""} ${selHero === id ? "sel" : ""} ${extra}" data-act="selhero" data-id="${id}" aria-label="${esc(h.name)}">${spriteCanvas(id)}${owned ? `<span class="lv">${lv}</span>` : ""}</button>`;
}
function viewHeroes() {
  const party = S.party.map((id, i) => id
    ? `<button class="hslot b-${HERO_BY_ID[id].tier} ${selHero === id ? "sel" : ""}" data-act="slot" data-i="${i}" aria-label="${esc(HERO_BY_ID[id].name)}">${spriteCanvas(id)}<span class="lv">${heroLevel(S.heroes[id])}</span></button>`
    : `<button class="hslot emptys" data-act="slot" data-i="${i}" aria-label="Empty party slot">+</button>`).join("");
  let detail = `<div class="card small muted">Tap a hero to see details. Heroes in your party add their bonus to DPS. Duplicates level them up.</div>`;
  if (selHero) {
    const h = HERO_BY_ID[selHero], c = S.heroes[selHero] || 0, lv = heroLevel(c);
    const next = C.LVL_CUM[lv] ?? null;
    const inParty = S.party.includes(selHero);
    const full = !S.party.includes(null);
    detail = `<div class="card detail">${spriteCanvas(selHero)}
      <div class="stack" style="gap:6px;min-width:0">
        <div><b class="c-${h.tier}">${esc(h.name)}</b><div class="small muted">${TIER_NAME[h.tier]}${c ? ` · Level ${lv}` : " · not owned yet"}</div></div>
        ${c ? `<div class="small num">+${heroPct(selHero).toFixed(0)}% DPS · ${next ? `${c}/${next} copies to level ${lv + 1}` : `Max level · extra copies give ${SHARD[h.tier]} shards`}</div>
        ${next ? `<div class="bar"><i style="width:${(c - (C.LVL_CUM[lv - 1] || 0)) / (next - (C.LVL_CUM[lv - 1] || 0)) * 100}%"></i></div>` : ""}
        <div class="row">${inParty ? `<button class="btn" data-act="unparty">Remove from party</button>` : `<button class="btn primary" data-act="toparty" ${full ? "disabled" : ""}>${full ? "Party full: tap a slot to swap" : "Add to party"}</button>`}</div>`
        : `<div class="small muted">Base bonus +${HERO_PCT[h.tier]}% DPS. Summon to recruit.</div>`}
      </div></div>`;
  }
  const owned = HEROES.filter(h => S.heroes[h.id]).length;
  const roster = TIERS.map(t => `<div class="tierhead c-${t}">${TIER_NAME[t]} · +${HERO_PCT[t]}% base</div><div class="roster">${POOL[t].map(id => heroTile(id)).join("")}</div>`).join("");
  return `<div class="stack">
    <div class="spread"><h2>Party</h2><span class="muted num">x${heroMult().toFixed(2)} DPS</span></div>
    <div class="party">${party}</div>
    <div class="spread"><label class="toggle"><input type="checkbox" id="autoparty" data-act="autoparty" ${S.autoParty ? "checked" : ""}> Auto-pick best party</label>
      ${!S.autoParty && partyWouldChange() ? `<button class="btn" data-act="autonow" style="padding:6px 10px">Fill best</button>` : ""}</div>
    ${detail}
    <div class="spread"><h2>Roster</h2><span class="muted num">${owned}/${HEROES.length} recruited</span></div>
    ${roster}
  </div>`;
}
function viewSummon() {
  const free = S.freeBanked + S.freeToday;
  const p1 = free >= 1 ? `Free (${free} left)` : `${C.PULL} gems`;
  const p10 = free >= 10 ? `Free (${free} left)` : `${C.PULL * 10} gems`;
  const ramp = [50, 55, 60, 65, 70, 75, 80].map(n => `<tr><td>Pull ${n}</td><td>${pct(pityRate(n), 2)}</td></tr>`).join("");
  return `<div class="stack">
    <div class="banner stack" style="gap:10px">
      <div class="spread"><h2>Hero Summon</h2><button class="btn" data-act="rates" style="padding:5px 10px">${showRates ? "Hide rates" : "Rates"}</button></div>
      <div class="small muted">Legendary or better every ${(1 / consolidated).toFixed(0)} pulls on average. Chances climb after pull ${C.PITY_SOFT}; guaranteed by ${C.PITY_HARD}.</div>
      <div class="spread small num"><span>Pity ${S.pity} / ${C.PITY_HARD}</span><span class="muted">L+ chance next: ${pct(pityRate(S.pity + 1), 1)}</span></div>
      <div class="pitybar"><i style="width:${S.pity / C.PITY_HARD * 100}%"></i><s style="left:${C.PITY_SOFT / C.PITY_HARD * 100}%"></s></div>
      <div class="grid2">
        <button class="btn primary" data-act="pull1" ${canPull(1) ? "" : "disabled"}>Summon x1<small>${p1}</small></button>
        <button class="btn primary" data-act="pull10" ${canPull(10) ? "" : "disabled"}>Summon x10<small>${p10} · 1 Epic+ guaranteed</small></button>
      </div>
    </div>
    ${showRates ? `<div class="card stack" style="gap:10px">
      <table class="rates num"><tr><th>Tier</th><th>Rate</th><th>Heroes</th><th>Base bonus</th></tr>
      ${TIERS.map(t => `<tr><td class="c-${t}">${TIER_NAME[t]}</td><td>${pct(RATES[t], 1)}</td><td>${POOL[t].length}</td><td>+${HERO_PCT[t]}%</td></tr>`).join("")}</table>
      <div class="small muted num">With pity, the real Legendary-or-better rate is ${pct(consolidated, 2)}. Mythic is 1 in 6 of those.</div>
      <table class="rates num"><tr><th>Pulls since last L+</th><th>L+ chance</th></tr>${ramp}</table></div>` : ""}
    <div class="card stack small num" style="gap:6px">
      <div class="spread"><span class="muted">Total summons</span><span>${S.totalPulls}</span></div>
      <div class="spread"><span class="muted">Legendary or better</span><span>${S.life.lplus}</span></div>
      <div class="spread"><span class="muted">Shards</span><span>${S.shards}</span></div>
      <div class="spread"><span class="muted">Free pulls reset</span><span>daily · ${C.FREE_PER_DAY} per day</span></div>
    </div>
  </div>`;
}
function viewDaily() {
  const cr = chestReadyIn();
  const quests = QUESTS.map((q, i) => {
    const v = Math.min(S.q[q.key], q.target), done = v >= q.target, cl = S.q.claimed[i];
    return `<div class="quest"><div><b>${q.name}</b><div class="small muted num">${v}/${q.target} · ${C.QUEST} gems</div></div>
      <button class="btn ${done && !cl ? "primary" : ""}" data-act="quest" data-i="${i}" ${done && !cl ? "" : "disabled"}>${cl ? "Claimed" : done ? "Claim" : "In progress"}</button></div>`;
  }).join("");
  return `<div class="stack">
    <h2>Daily</h2>
    <div class="card stack" style="gap:12px">
      <div class="quest"><div><b>Idle chest</b><div class="small muted num">${cr > 0 ? `Ready in ${dur(cr)}` : "Ready"} · ${C.CHEST_GEMS} gems every ${C.CHEST_H}h</div></div>
        <button class="btn ${cr <= 0 ? "primary" : ""}" data-act="chest" ${cr <= 0 ? "" : "disabled"}>${cr <= 0 ? "Claim" : "Waiting"}</button></div>
      ${quests}
    </div>
    <div class="card small muted num">Also: ${C.LOGIN} gems each new day, ${C.FIRST_CLEAR} gems for each boss you beat for the first time, ${C.FREE_PER_DAY} free summons a day. Away time pays gold at ${C.OFF_RATE * 100}% for up to ${C.OFF_CAP_H}h.</div>
    <h2>Playtest tools</h2>
    <div class="card stack" style="gap:10px">
      <div class="small muted">Game speed. Days, chests and quests run on game time, so higher speed is a quick way to feel a week of play.</div>
      <div class="seg" role="group" aria-label="Game speed">${[1, 10, 60, 300].map(v => `<button data-act="speed" data-v="${v}" class="${S.speed === v ? "on" : ""}">x${v}</button>`).join("")}</div>
      <div class="grid2">
        <button class="btn" data-act="skip1">Play 1 hour<small>Simulates active play</small></button>
        <button class="btn" data-act="skip8">Go offline 8h<small>Gold-only catch-up</small></button>
      </div>
      <div class="grid2">
        <button class="btn" data-act="gems">+1000 gems<small>Test summons</small></button>
        <button class="btn" data-act="reset" style="border-color:var(--bad)">${resetArmed ? "Tap again to reset" : "Reset save"}<small>${resetArmed ? "This erases progress" : "Start over"}</small></button>
      </div>
      <div class="small muted num">Lifetime: ${fmt(S.life.kills)} kills · ${S.life.bosses} bosses · ${S.life.fails} boss fails · ${S.life.drops} gear drops</div>
    </div>
  </div>`;
}
let resetArmed = false;

// ---------------- Reveal & modal ----------------
let revealTimer = null;
function showReveal(res, dpsBefore) {
  const box = document.getElementById("reveal");
  const best = res.reduce((m, r) => Math.max(m, TIERS.indexOf(r.tier)), 0);
  box.innerHTML = `<div class="cards ${res.length === 1 ? "one" : ""}">${res.map((r, i) => {
    const h = HERO_BY_ID[r.id];
    return `<div class="rcard b-${r.tier} glow-${r.tier}" data-i="${i}">${r.isNew ? `<span class="tag">NEW</span>` : r.up ? `<span class="tag up">Lv${r.lvl}</span>` : ""}${spriteCanvas(r.id)}<div class="nm c-${r.tier}">${esc(h.short)}</div></div>`;
  }).join("")}</div>
  <div class="small num" style="text-align:center">${best >= 3 ? `<b class="c-${TIERS[best]}">${TIER_NAME[TIERS[best]]}!</b> ` : ""}DPS ${fmt(dpsBefore)} → <b>${fmt(dps())}</b></div>
  <button class="btn primary" data-act="closereveal" style="text-align:center;min-width:160px">Continue</button>
  <div class="hint">Tap anywhere to skip</div>`;
  hydrateSprites(box);
  box.hidden = false;
  const cards = [...box.querySelectorAll(".rcard")];
  let i = 0; clearInterval(revealTimer);
  revealTimer = setInterval(() => { if (i >= cards.length) { clearInterval(revealTimer); return; } cards[i++].classList.add("on"); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 140);
}
function closeReveal() {
  const box = document.getElementById("reveal");
  const cards = [...box.querySelectorAll(".rcard:not(.on)")];
  if (cards.length) { cards.forEach(c => c.classList.add("on")); clearInterval(revealTimer); return; }
  box.hidden = true; dirty = true;
}
function showModal(html) { const m = document.getElementById("modal"); m.innerHTML = `<div class="card">${html}</div>`; m.hidden = false; }

// ---------------- Input ----------------
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  tab = b.dataset.tab; resetArmed = false;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === b));
  panel.scrollTop = 0; dirty = true; renderPanel();
});
document.getElementById("bossbtn").addEventListener("click", () => { attemptBoss(); hud(); });
document.getElementById("reveal").addEventListener("click", e => { closeReveal(); });
document.getElementById("modal").addEventListener("click", e => { if (e.target.closest("[data-act=closemodal]") || e.target.id === "modal") document.getElementById("modal").hidden = true; });
panel.addEventListener("change", e => { if (e.target.id === "autoparty") { S.autoParty = e.target.checked; if (S.autoParty) autoParty(); dirty = true; renderPanel(); } });
panel.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a !== "reset") resetArmed = false;
  switch (a) {
    case "stat1": buyStat(1); break;
    case "stat10": buyStat(10); break;
    case "statmax": { const k = buyStat(1e4); toast(`+${k} ATK levels`, "gold"); break; }
    case "enh": enhance(i); break;
    case "selhero": selHero = selHero === b.dataset.id ? null : b.dataset.id; break;
    case "slot": {
      const cur = S.party[i];
      if (selHero && S.heroes[selHero] && cur !== selHero) {
        const j = S.party.indexOf(selHero); if (j >= 0) S.party[j] = cur;
        S.party[i] = selHero; S.autoParty = false; selHero = null;
      } else selHero = cur || null;
      break;
    }
    case "toparty": { const j = S.party.indexOf(null); if (j >= 0 && selHero) { S.party[j] = selHero; S.autoParty = false; } break; }
    case "unparty": { const j = S.party.indexOf(selHero); if (j >= 0) { S.party[j] = null; S.autoParty = false; } break; }
    case "autonow": autoParty(); break;
    case "autoparty": return;
    case "pull1": pull(1); break;
    case "pull10": pull(10); break;
    case "rates": showRates = !showRates; break;
    case "quest": claimQuest(i); break;
    case "chest": claimChest(); break;
    case "speed": S.speed = +b.dataset.v; break;
    case "skip1": { suppressFx = true; const before = S.stage; for (let k = 0; k < 36000; k++) { tick(); if (k % 600 === 0) ensureDay(); } suppressFx = false; ensureDay(); toast(`1 hour played: stage ${before} → ${S.stage}`, "good"); log(`Played 1h: stage ${before} → ${S.stage}`); break; }
    case "skip8": { const g = catchUp(8 * 3600, false); toast(`8h offline: +${fmt(g)} gold`, "gold"); break; }
    case "gems": S.gems += 1000; break;
    case "reset": if (!resetArmed) { resetArmed = true; break; } resetArmed = false; S = newState(); selHero = null; fx.hits = []; save(); toast("Save reset"); break;
  }
  dirty = true; renderPanel(); hud(); save();
});

// ---------------- Loop ----------------
let acc = 0, last = performance.now(), uiT = 0, saveT = 0;
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  if (document.getElementById("reveal").hidden) {
    acc += dt * S.speed;
    let n = 0; const cap = 3000;
    while (acc >= C.TICK && n < cap) { tick(); acc -= C.TICK; n++; }
    if (n >= cap) acc = 0;
    ensureDay();
  }
  drawBattle(dt);
  uiT += dt; saveT += dt;
  if (uiT > 0.25) { uiT = 0; hud(); if (dirty || tab === "up" || tab === "gear" || tab === "daily" || tab === "summon") { renderPanel(); dirty = false; } }
  if (saveT > 5) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}

function start(data) {
  S = (data && data.S) || load();
  let welcome = null;
  if (!S) { S = newState(); }
  else if (!(data && data.S)) {
    const away = (Date.now() - (S.lastReal || Date.now())) / 1000;
    if (away > 60) { const g = catchUp(away, true); welcome = { away, g }; }
  }
  window.claude?.hot?.snapshot?.(() => ({ S }));
  resize(); renderPanel(); hud();
  if (welcome) showModal(`<h3>Welcome back</h3><p class="num">You were away ${dur(welcome.away)}. Your party kept fighting at half speed.</p><p class="num"><span class="coin"></span> <b>+${fmt(welcome.g)} gold</b>${welcome.away > C.OFF_CAP_H * 3600 ? ` <span class="muted">(capped at ${C.OFF_CAP_H}h)</span>` : ""}</p><button class="btn primary" data-act="closemodal">Collect</button>`);
  else if (S.totalPulls === 0 && S.life.kills < 3) showModal(`<h3>Idle RNG</h3><p>Your knight fights on their own. Spend gold on ATK, enhance the gear that drops, and summon heroes for your party.</p><p class="num">Starter gift: <b>${C.TUT_GEMS} gems</b> and <b>${C.TUT_PULLS} free summons</b>.</p><button class="btn primary" data-act="closemodal">Start</button>`);
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
