<filter id="ik-md-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
<linearGradient id="ik-md-root" x1="0" y1="0" x2="1" y2="0.3"><stop offset="0" stop-color="#e8c08a"/><stop offset=".55" stop-color="#d9a86c"/><stop offset="1" stop-color="#8a6036"/></linearGradient>
