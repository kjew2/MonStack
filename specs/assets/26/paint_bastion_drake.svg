<radialGradient id="pt-bd-shadow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#1a1210" stop-opacity="0.65"/><stop offset="1" stop-color="#1a1210" stop-opacity="0"/>
</radialGradient>
<filter id="pt-bd-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="pt-bd-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>
<filter id="pt-bd-bokeh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
