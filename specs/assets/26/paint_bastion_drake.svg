<stop offset="0" stop-color="#fff4c2"/><stop offset="0.4" stop-color="#ffb347"/><stop offset="1" stop-color="#e2531c"/>
</radialGradient>
<radialGradient id="pt-bd-glow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ffb347" stop-opacity="0.9"/><stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/>
