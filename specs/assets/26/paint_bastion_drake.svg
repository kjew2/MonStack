<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
<defs>
<linearGradient id="pt-bd-sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1b3a48"/><stop offset="0.5" stop-color="#5a5a5e"/><stop offset="1" stop-color="#e09450"/>
</linearGradient>
