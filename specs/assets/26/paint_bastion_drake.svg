<stop offset="0" stop-color="#ffd9a0" stop-opacity="0.5"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
</radialGradient>
<radialGradient id="pt-bd-skin" cx="0.35" cy="0.3" r="0.8">
<stop offset="0" stop-color="#f07a52"/><stop offset="0.5" stop-color="#c2452e"/><stop offset="1" stop-color="#6e1f16"/>
</radialGradient>
<linearGradient id="pt-bd-steel" x1="0" y1="0" x2="0.6" y2="1">
<stop offset="0" stop-color="#e3e8f2"/><stop offset="0.35" stop-color="#a9b2c4"/><stop offset="0.8" stop-color="#4a4f5c"/><stop offset="1" stop-color="#2c3038"/>
</linearGradient>
<linearGradient id="pt-bd-steel2" x1="0" y1="0" x2="1" y2="1">
