# Deploys the web game to GitHub Pages (https://kjew2.github.io/MonStack/, specs/08 section 4.2) after the check workflow
# passes on main, so only a commit that passed ./check.sh goes live. Google sign-in (issue #19) needs this real address:
# the claude.ai phone artifact cannot load Google's sign-in script.
# One-time setup by the repo owner: Settings > Pages > Source: GitHub Actions.
# Before the site, the `module` job deploys the account server (the MonStackAccount Cloud Code module, specs/27 section 7) built
# from the same commit, so the site never runs ahead of the server's content. It needs a UGS service account in the repo
# secrets UGS_SERVICE_KEY_ID and UGS_SERVICE_SECRET_KEY (one-time setup: server/ugs/README.md); without them it logs that it
# skipped and the site deploys as before.
name: pages

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  module:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UGS_CLI_SERVICE_KEY_ID: ${{ secrets.UGS_SERVICE_KEY_ID }}
      UGS_CLI_SERVICE_SECRET_KEY: ${{ secrets.UGS_SERVICE_SECRET_KEY }}
      # Public identifiers, as in web/auth.js; repo variables override them (e.g. a dev environment).
      UGS_CLI_PROJECT_ID: ${{ vars.UGS_PROJECT_ID || 'e83a4b44-27a7-4f76-8769-08380b340736' }}
      UGS_CLI_ENVIRONMENT_NAME: ${{ vars.UGS_ENVIRONMENT || 'production' }}
      # kj's UGS player ids for debug commands (specs/27 section 6.3), built into the module; empty: nobody.
      MONSTACK_DEBUG_PLAYERS: ${{ vars.MONSTACK_DEBUG_PLAYERS }}
    steps:
      - id: gate
        name: Check for the UGS service account
        run: |
          if [ -z "$UGS_CLI_SERVICE_KEY_ID" ] || [ -z "$UGS_CLI_SERVICE_SECRET_KEY" ]; then
            echo "::notice title=Cloud Code module not deployed::The secrets UGS_SERVICE_KEY_ID and UGS_SERVICE_SECRET_KEY are not set, so the MonStackAccount module was skipped (setup: server/ugs/README.md). The site deploys anyway."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # .NET 10 only in this job (Cloud Code modules target net10.0); the site job keeps .NET 8 for wasm-tools.
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet10
        with:
          dotnet-version: "10.0.x"

      - if: steps.gate.outputs.deploy == 'true'
        name: Test the module in process
        run: dotnet test server/ugs/MonStackAccount.Tests -c Release -p:MonStackBuildSuffix=-net10 -nologo

      - if: steps.gate.outputs.deploy == 'true'
        name: Deploy the module to Cloud Code
        run: bash server/ugs/deploy.sh MonStackAccount

      # The keep-warm schedule (issue #109, server/ugs/README.md): Warm every 10 minutes. The repo variable MONSTACK_KEEP_WARM=off
      # removes it. Needs two more roles on the service account; a failure here warns and the site still deploys.
      - if: steps.gate.outputs.deploy == 'true'
        name: Keep the module warm
        continue-on-error: true
        env:
          KEEP_WARM: ${{ vars.MONSTACK_KEEP_WARM }}
        run: |
          if [ "$KEEP_WARM" = off ]; then set -- --off; fi
          python3 -I server/ugs/keep_warm.py "$@" || {
            echo "::warning title=Keep-warm not set::server/ugs/keep_warm.py failed (see the log). The service account needs the roles Scheduler Configuration Editor and Triggers Configuration Editor (server/ugs/README.md)."
            exit 1
          }

  deploy:
    needs: module
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0   # web/wasm/build.sh counts merges since VERSION changed for the version's minor number

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # .NET 8 only, in its own directory (see check.yml: wasm-tools must match net8.0).
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "8.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Build the engine and lay out the site
        run: |
          bash web/wasm/build.sh
          bash web/wasm/site.sh "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@v4
