<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MonStack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600&display=swap">
<style>
/* One phone-height column: header, scrolling body, tab bar. Light palette (daylight).
   Theme tokens (issue #115): every colour, font, radius and shadow the page uses, and the shared motion timings, are variables here, so an art
   direction is mostly a swap of this block (plus assets). No colour literal lives outside :root; a light base only needs new
   values here (the daylight base is one). Per-element colours come from the engine (RunContent elements), not from here. */
:root {
  /* Art direction: daylight (kj, 2026-10-31; specs/26 section 4.1): a light sky-blue base, white rounded cards with soft blue
     shadows, chunky buttons that press down, pill tabs, a rounded friendly title face. The creature art stays hunter (section 6). */
  /* base: background, surfaces, lines, ink */
  --bg: #f4f9ff; --bg-top: #cfe6ff;  /* pale sky, a deeper blue at the top */
  --cloud: rgba(255, 255, 255, .9);  /* the soft clouds in the sky behind everything */
  --panel: #ffffff; --panel-hi: #ffffff; --panel-2: #eef5fd; --line: #d3e2f4; --line-soft: #e3edf8; --line-faint: #edf3fa;
  --text: #1d3557; --muted: #5f7896; --shade: #ffffff;   /* --shade is the halo behind text drawn over fills (light here) */
  --track: #e3ecf7;                 /* an empty bar */
  --tile: #f1f6fc; --tile-mix: #ffffff;   /* a node tile, and the white a stat tint is mixed into */
  --scrim: rgba(236, 244, 253, .99); /* behind the modal */
  --toast-bg: #ffffff; --cd-veil: rgba(29, 53, 87, .55); --keycap: #c9daf0; --arena-top: #dcebff;
  /* accents: --gems is the one accent (focus, selection, skill points): sky blue; --gold for rare things. Text-strength shades, so
     they read on white; --gold-pop is the bright gold for big loud text with an outline. */
  --gold: #b77b00; --gold-pop: #ffc23d; --gems: #2b6fd6; --shield: #6fd3ff; --tear: #7cc8ff; --ok: #1f9d5c; --bad: #e0384c; --warn: #e06a1b; --epic: #8a4fe0;
  --accent: var(--gems);
  /* accent tints for filled buttons, badges and flashes */
  --ok-bg: #e3f7ec; --ok-bg-2: #d3f1e1; --ok-flash: #c9f0da; --ok-keycap: #9fd9b8; --on-ok: #ffffff; --ok-pop: #1f9d5c;
  --gems-bg: #e1efff; --gems-keycap: #b8d3f5; --gems-deep: #d2e6ff; --gems-light: #e1efff; --gems-stroke: #1f5bb5; --gems-shadow: #9cc2f0;
  --warn-bg: #ffeede; --warn-keycap: #f5c49c; --fight: #ff6b4a; --fight-keycap: #d44a2b; --on-fight: #ffffff; --foe-ink: #d0283e;
  --gold-bg: #fff3d1; --gold-bg-2: #ffe7a8; --gold-deep: #fff8e6; --gold-mid: #fff0c2; --gold-dark: #ffe1a0; --gold-stroke: #8a5a00;
  --epic-deep: #f3ebff; --epic-light: #ede3ff; --epic-stroke: #4c2590; --epic-shadow: #d6c2fb;
  --pop-red: #e0384c;               /* the offset shadow under loud text (super drill, POW) */
  --fail-ink: #6f84a3; --fail-bg: #e9eef5;
  --tick: rgba(29, 53, 87, .22); --tick-hit: #ffffff;   /* milestone ticks on a stat gauge, before and after they are reached */
  /* per-stat colours (--st): the stat gauges, chips and node tiles take them through .st-<stat> */
  --st-hp: #e0384c; --st-str: #e8742a; --st-int: #2b6fd6; --st-wis: #8a4fe0;
  --st-dex: #1f9d5c; --st-def: #6c7a93; --st-spd: #0fa3b1; --st-luk: #c99400;
  --on-st: #ffffff;                 /* text on a solid stat colour */
  --art-bg: #000000; --art-shade: rgba(0, 0, 0, .75); --on-art: #ffffff;   /* behind a creature portrait, the shade under text on it, that text */
  /* skill tiles take a per-skill hue from the page; these are the saturation and lightness it is drawn at (pastel, dark ink on top) */
  --skill-bg: 70%, 88%; --skill-edge: 60%, 55%; --skill-tile: 65%, 86%;
  /* glows: soft coloured lifts instead of neon */
  --glow-gems: 0 2px 8px rgba(43, 111, 214, .25); --glow-gold: 0 2px 10px rgba(201, 148, 0, .35);
  /* type: a rounded display face for titles and loud text, one friendly rounded sans for labels, numbers and body */
  --font-display: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-title: 'Fredoka', 'Nunito', 'Arial Rounded MT Bold', sans-serif;
  --font-comic: var(--font-title);
  --font-hand: 'Caveat', 'Comic Sans MS', 'Segoe Print', cursive;
  /* shape: generous rounding */
  --r-xs: 6px; --r-sm: 8px; --r: 14px; --r-lg: 16px; --r-xl: 20px; --r-pill: 999px;
  --shadow-card: 0 4px 14px rgba(40, 90, 160, .09); --shadow-bar: 0 -4px 14px rgba(40, 90, 160, .06);
  --shadow-float: 0 4px 14px rgba(40, 90, 160, .18);
  --shadow-pop: 0 8px 22px rgba(40, 90, 160, .2);
  --shadow-tip: 0 10px 28px rgba(40, 90, 160, .25);
  --shadow-key: 0 3px 0 var(--keycap); --shadow-key-down: 0 1px 0 var(--keycap);
  --text-shade: 0 1px 0 rgba(255, 255, 255, .7);
  /* the rank fight intro (2026-11-02): a loud dark screen split between the two sides, white outlined names */
  --hype-bg: #1d3557; --hype-you: #2b6fd6; --hype-foe: #ff6b4a; --hype-lines: rgba(255, 255, 255, .13); --hype-ink: #ffffff; --hype-stroke: #1d3557;
  --hype-flash: rgba(255, 255, 255, .85); --hype-shadow: rgba(29, 53, 87, .35);
  /* the evolution scene: a night sky whatever the theme, so the white silhouettes and the flash read */
  --evo-bg: radial-gradient(circle at 50% 40%, #2b4a8a 0%, #121a3a 55%, #070a1a 100%); --evo-ink: #ffffff; --evo-glow: #9fd4ff;
  --evo-ray: rgba(159, 212, 255, .16); --evo-spark: #ffe48a;
  /* motion (prefers-reduced-motion sets these to 0s at the end of the sheet) */
  --dur-fast: .12s; --dur: .25s; --dur-slow: .5s;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
/* No double-tap zoom mid-play (issue #128). touch-action does not inherit and scroll containers reset it, so set it on every element; pinch-zoom and scrolling still work. */
*, *::before, *::after { touch-action: manipulation; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.35 var(--font-body); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
/* A game, not a page (issue #123): a long press or a drag selects no text and brings up no copy or look-up callout; real text fields still take typing.
   Set on every element, not only body: iOS Safari still selected text that merely inherited none. The selectstart guard below backs it up. */
*, *::before, *::after { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, select, [contenteditable], [contenteditable] * { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible { outline: 2px solid var(--gems); outline-offset: 2px; }
a { color: var(--gems); }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .ok { color: var(--ok); } .bad { color: var(--bad); } .gold { color: var(--gold); } .gems { color: var(--gems); }
h2 { margin: 0; font: 600 18px var(--font-display); text-wrap: balance; }
h3 { margin: 0; font: 600 12px var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
small, .small { font-size: 12px; }

#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; background: var(--bg); }
#top { display: flex; align-items: center; gap: 10px; padding: 8px var(--gutter-r) 8px var(--gutter-l); background: var(--panel); border-bottom: 1px solid var(--line); }
#top .title { font: 700 16px var(--font-display); flex: 1; }
#server-mode { font-size: 11px; line-height: 1.1; max-width: 64px; text-align: right; }   /* two short lines: the header stays phone-wide */
/* The sync wait (web/sync.js): "Connecting...", a new version, another tab. Covers the whole app so nothing is tapped meanwhile. */
#sync-wait { position: absolute; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px var(--gutter-r) 16px var(--gutter-l); }
#sync-wait .sync-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); padding: 18px; max-width: 360px; width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: center; }
#sync-wait h2, #sync-wait p { margin: 0; overflow-wrap: anywhere; }
.link-btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r-sm); padding: 6px 10px; font-size: 13px; text-decoration: none; color: var(--text); white-space: nowrap; }
#main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 12px var(--gutter-r) 20px var(--gutter-l); -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 12px; }
#main > * { flex-shrink: 0; }   /* scroll instead of squeezing a card: .card.stats has overflow:hidden, so a fight card above it left only the HP row (issue #113) */
#tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--panel); border-top: 1px solid var(--line); padding: 0 var(--gutter-r) env(safe-area-inset-bottom, 0px) var(--gutter-l); }
#tabs button { position: relative; border: 0; background: none; padding: 12px 0 13px; font: 600 13px var(--font-display); letter-spacing: .04em; color: var(--muted); }
#tabs button[aria-selected="true"] { color: var(--text); box-shadow: inset 0 3px 0 var(--gems); }
#tabs .tabsp { font-weight: 700; }
/* Home tabs: a count rides the tab's top right corner as a pill, so six tabs fit a 390 px phone */
#tabs .tabsp.pill { position: absolute; top: -7px; right: 0; padding: 0 5px; border-radius: var(--r-pill); background: var(--panel-2); border: 1px solid var(--line); font-size: 10px; line-height: 15px; letter-spacing: 0; }
#tabs button { white-space: nowrap; }
.sticky-start { position: sticky; bottom: 0; z-index: 2; }
/* The action bar (issue #130): a screen's main buttons ride the bottom of its scrolling pane (#main or #modal), so they are in
   reach without a scroll. It is the pane's last child: margin-top:auto drops it to the bottom of a short screen, and the negative
   bottom margin and inset cover the pane's bottom padding, so content scrolls away under it. --pane-pb is that padding. */
#main, .rbbody { --pane-pb: 20px; } #modal { --pane-pb: 14px; }
.actionbar { position: sticky; bottom: calc(-1 * var(--pane-pb)); z-index: 3; display: flex; flex-wrap: wrap; gap: 8px; margin: auto calc(-1 * var(--gutter-r)) calc(-1 * var(--pane-pb)) calc(-1 * var(--gutter-l));
  padding: 14px var(--gutter-r) calc(var(--pane-pb) - 4px) var(--gutter-l); background: linear-gradient(transparent, var(--bg) 14px); }
.actionbar > .btn { flex: 1 1 auto; margin: 0; }
.actionbar > .btn.block { flex-basis: 100%; }
/* A screen's own header: Back on the left, the title, then what it shows on the right (issue #130: Back is never at the page's foot) */
.screenhead { display: flex; align-items: center; gap: 10px; }
.screenhead h2 { flex: 1; min-width: 0; }
/* Raise tab: the species carousel. Cards snap to the middle and the neighbours peek in from the sides. */
.carousel { --card: 240px; position: relative; -webkit-overflow-scrolling: touch; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
  padding: 4px max(14%, calc(50% + (var(--gutter-l) + var(--gutter-r)) / 2 - var(--card) / 2)) 8px; margin: 0 calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter-l)); scrollbar-width: none; overscroll-behavior-x: contain; }
.carousel::-webkit-scrollbar { display: none; }
.card.species-card { flex: 0 0 100%; scroll-snap-align: center; position: relative; padding: 0; gap: 0; overflow: hidden; text-align: left; opacity: .55; transform: scale(.94); transition: opacity var(--dur-fast) ease-out, transform var(--dur-fast) ease-out; will-change: transform; }
.card.species-card.sel { opacity: 1; transform: none; }
/* The portraits are square (512 px): show the whole image, edge to edge, and lay the name over its foot. The card is at most
   --card wide (issue #120: 240 px, so the info and Start button stay high on a phone; the side padding centres it, % being of #main's width) */
.species-card .pimg { display: grid; place-items: center; aspect-ratio: 1; background: var(--art-bg); }
.species-card .pimg img { display: block; width: 100%; height: 100%; object-fit: contain; }
.species-card .pimg .sprite { width: 45%; height: auto; }
.species-card > .row { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 14px 12px; background: linear-gradient(transparent, var(--art-shade)); }
.species-card > .row b { color: var(--on-art); font-size: 20px; }
.dots { display: flex; justify-content: center; gap: 8px; margin-top: -6px; }
.dot { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: var(--line); }
.dot.on { background: var(--gems); }
.species-info { display: flex; flex-direction: column; gap: 6px; will-change: transform, opacity; }
.howto summary { cursor: pointer; }
.howto p { margin: 6px 0 0; }
/* Skill point gains (issue #86): a float-up by the HUD's SP count, a pulse on the count, the fight result's badge */
#floats { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
.spgain { position: absolute; padding: 2px 8px; border-radius: var(--r-lg); background: var(--gems-bg); border: 1px solid var(--gems); color: var(--gems); font: 700 13px var(--font-display); white-space: nowrap; box-shadow: var(--shadow-float); animation: spfloat 2s ease-out both; }
@keyframes spfloat { 0% { opacity: 0; transform: translateY(10px); } 15% { opacity: 1; transform: translateY(0); } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-22px); } }
.spcount.pulse { display: inline-block; animation: sppulse .7s ease-out 2; }
@keyframes sppulse { 40% { transform: scale(1.35); color: var(--text); text-shadow: 0 0 8px var(--gems); } }
.spbadge { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--gems); border-radius: var(--r); background: var(--gems-bg); color: var(--gems); font-size: 13px; }
.spbadge > b { font: 700 28px/1 var(--font-display); white-space: nowrap; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.card.alert { border-color: var(--gems); }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r); padding: 10px 14px; font-weight: 600; min-height: 44px; }
.btn.primary { background: var(--ok-bg); border-color: var(--ok); }
.btn.gemsy { background: var(--gems-bg); border-color: var(--gems); }
.btn.warn { background: var(--warn-bg); border-color: var(--warn); }
.btn.small { min-height: 34px; padding: 6px 10px; font-size: 13px; }
.btn.block { width: 100%; }
.tag { font: 700 11px var(--font-display); letter-spacing: .06em; padding: 2px 6px; border-radius: var(--r-xs); background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
.sprite { image-rendering: pixelated; image-rendering: crisp-edges; display: block; width: 56px; height: 56px; flex: none; border-radius: var(--r); background: var(--panel-2); padding: 4px; }

/* HUD */
.hud { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; }
.hud .sprite { grid-row: span 2; }
.hud-line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; font-family: var(--font-display); font-weight: 600; }
.bar { position: relative; height: 16px; border-radius: var(--r-xs); background: var(--track); overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--ok); }
/* The damage chart (Dungeon and Endless results): per monster, a bar each for dealt, taken and healed, on one scale */
.cpick { width: 100%; min-height: 40px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); color: var(--text); font: inherit; font-size: 16px; }
.dchart { display: flex; flex-direction: column; gap: 12px; margin: 10px 0; }
.dchart .cunit { display: flex; flex-direction: column; gap: 4px; }
.dchart .crow { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 8px; }
.dchart .cbar { height: 12px; border-radius: var(--r-xs); background: var(--track); overflow: hidden; }
.dchart .cfill { height: 100%; border-radius: var(--r-xs); }
.dchart .dealt .cfill { background: var(--gems); }
.dchart .taken .cfill { background: var(--bad); }
.dchart .healed .cfill { background: var(--ok); }
.dchart .cval { min-width: 64px; text-align: right; }
.bar.energy .fill { background: var(--gems); }
.bar.low .fill { background: var(--bad); }
.bar.hp .shield { position: absolute; left: 0; bottom: 0; height: 40%; width: 0; background: var(--shield); border-top: 1px solid rgba(255, 255, 255, .85); transition: width .2s; }
.bar.hp.shielded { box-shadow: 0 0 0 1px var(--shield); }
.bar span { position: relative; display: block; text-align: center; font: 600 11px/16px var(--font-display); text-shadow: var(--text-shade); }
.pips { display: flex; gap: 5px; }
.hud-meters { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
.hud-meters .bar { flex: 1; min-width: 0; }
.pip { width: 14px; height: 14px; border-radius: var(--r-pill); border: 2px solid var(--gems); }
.pip.full { background: var(--gems); }

/* Train */
/* Drill odds as one row of equal cells, value over label (issue #115): fail, success, super, injury, the energy cost (or Momentum);
   Second Wind as a sixth cell while it is armed */
.odds { display: flex; gap: 4px; }
.ochip { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column-reverse; align-items: center; padding: 3px 2px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--panel); font: 600 10px/1.3 var(--font-display); color: var(--muted); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; letter-spacing: .03em; }
.ochip b { font-size: 14px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; text-transform: none; letter-spacing: 0; }
.ochip.o-fail b { color: var(--fail-ink); } .ochip.o-success b { color: var(--ok); } .ochip.o-super b { color: var(--gold); } .ochip.o-cost b { color: var(--gems); }
.ochip.o-injury.on { border-color: var(--bad); } .ochip.o-injury.on b { color: var(--bad); }
.ochip.o-free { border-color: var(--gems); color: var(--gems); } .ochip.o-shield { border-color: var(--gold); color: var(--gold); }
/* Stat rows (the grade screen's stat breakdown): label and bar, a divider between rows */
.stat { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 46px; margin: 0 -12px; padding: 5px 12px; }
.stat + .stat { border-top: 1px solid var(--line); }
.stat .lbl { font: 700 13px var(--font-display); color: var(--st, var(--text)); }
/* Two columns of compact stat rows (grade screen, Vault detail; issue #130) */
.statgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 14px; row-gap: 6px; }
.statgrid .stat, .statgrid .stat + .stat { min-height: 0; margin: 0; padding: 2px 0; border-top: 0; grid-template-columns: 34px minmax(0, 1fr); gap: 6px; }
/* The stage (Train tab): the monster in the middle, actions and energy along its top, the last action's result under it */
.hud.staged { grid-template-columns: 1fr; }
.card.stage { position: relative; gap: 4px; padding: 8px 10px; background: radial-gradient(ellipse 60% 50% at 50% 60%, var(--arena-top), transparent 75%), var(--panel); }
.stage-meters { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stage-ap { display: flex; align-items: center; gap: 8px; }
.stage-meters .bar.energy { flex: 0 1 150px; min-width: 0; }
.stage-mon { align-self: center; position: relative; }
.stage-mon::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 2px; height: 14px; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--gems) 35%, transparent), transparent); z-index: 0; }
/* three classes: beats the themed .sprite.art frame further down the sheet */
.stage .stage-mon .sprite { position: relative; z-index: 1; width: 176px; height: 176px; max-width: 100%; padding: 0; background: none; border: 0; animation: bob 2.4s ease-in-out infinite; }
.stage .stage-mon.hop .sprite { animation: hop .45s ease-out; }
@keyframes bob { 50% { transform: translateY(-4px); } }
@keyframes hop { 30% { transform: translateY(-14px) scale(1.04); } }
/* A bad drill (fail tier or an injury): the monster slumps, sways its head and greys out, and a tear drips down */
.stage .stage-mon.sad .sprite { transform-origin: 50% 100%; animation: sad 2.2s ease-in-out both; }
.stage-mon.sad::before { content: ""; position: absolute; left: 34%; top: 32%; z-index: 2; width: 11px; height: 15px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  background: var(--tear); box-shadow: inset -2px -2px 0 color-mix(in srgb, var(--shade) 25%, transparent); clip-path: polygon(50% 0, 100% 60%, 100% 100%, 0 100%, 0 60%);
  animation: tear 2.2s ease-in both; pointer-events: none; }
@keyframes sad { 0% { transform: none; filter: none; } 18% { transform: translateY(8px) scale(1.04, .9); filter: saturate(.45) brightness(.88); }
  38% { transform: translateY(8px) scale(1.04, .9) rotate(-5deg); } 58% { transform: translateY(8px) scale(1.04, .9) rotate(4deg); }
  78% { transform: translateY(8px) scale(1.04, .9) rotate(-2deg); filter: saturate(.45) brightness(.88); } 100% { transform: none; filter: none; } }
@keyframes tear { 0%, 20% { opacity: 0; transform: translateY(0) scale(.4); } 30% { opacity: 1; transform: translateY(0) scale(1); }
  85% { opacity: 1; transform: translateY(44px); } 100% { opacity: 0; transform: translateY(54px); } }
/* The result line keeps one height whatever it says (the outcome, then its notes on one line), so nothing under it moves */
.stage .result { height: 38px; overflow: hidden; justify-content: center; align-items: center; text-align: center; font-size: 13px; line-height: 17px; }
.stage .result.hint { font-size: 12px; }
.stage .result > * { max-width: 100%; }
.stage .result .notes { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* An injury: a banner laid over the monster (not a card above the stage, which pushed the drill pad down) */
.stage .injury-banner { position: absolute; left: 10px; right: 10px; top: 40px; z-index: 3; padding: 8px 10px; border: 1px solid var(--bad);
  border-radius: var(--r-sm); background: color-mix(in srgb, var(--panel) 92%, transparent); box-shadow: var(--shadow-card); text-align: center; pointer-events: none; }
/* The drill pad: a 4x2 grid of stat tiles in the stat's colour. The whole tile is the Drill button (issue #124); the stat's
   tooltip is the small "i" in its top right corner, a sibling over the button, so a drill tap never lands on a tooltip trigger. */
.pad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.dtile { position: relative; display: flex; flex-direction: column; min-width: 0; border: 1px solid color-mix(in srgb, var(--st) 55%, transparent); border-radius: var(--r-lg);
  background: color-mix(in srgb, var(--st) 12%, var(--tile)); overflow: hidden; }
.dtile .meta { padding-right: 16px; white-space: nowrap; }   /* the label; the right end is left to the "i" */
.dtile .lbl { font: 700 12px var(--font-display); letter-spacing: .04em; color: var(--st); }
.dtile .vrow { display: flex; flex-direction: column; align-items: flex-start; white-space: nowrap; }   /* the value, the growth below it: always, so a wider value (113.5) never grows the tile and moves the pad and Rest */
.dtile .gmul { color: var(--muted); font-size: 10px; }
.dtile .drill { flex: 1; width: 100%; display: flex; flex-direction: column; gap: 5px; border: 0; background: none; padding: 5px 7px 8px; text-align: left; min-height: 44px; transition: transform var(--dur-fast); }
.dtile .drill:active:not(:disabled) { transform: scale(.95); }
.dtile.off { opacity: .45; } .dtile .drill:disabled { opacity: 1; }   /* dim the whole tile, its "i" included, while drilling is blocked */
.dtile .info { position: absolute; top: 0; right: 0; width: 26px; height: 26px; padding: 0; border: 0; background: none; display: grid; place-items: center; text-decoration: none; }
.dtile .info .ic { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--st); color: var(--st); display: grid; place-items: center; font: italic 700 10px/1 Georgia, serif; }
.dtile .info[aria-expanded="true"] .ic { background: var(--st); color: var(--tile); }
.dtile .val { font-weight: 700; font-size: 18px; line-height: 1; }
.dtile .bar.gauge { height: 6px; overflow: visible; border-radius: var(--r-xs); }
.dtile .bar.gauge .fill { border-radius: var(--r-xs); }
.dtile .bar .tick { top: -2px; bottom: -2px; }
/* A stat gauge (issue #115): the bar in its stat colour, a tick per milestone (lit once reached) instead of the threshold text */
.bar.gauge .fill { background: var(--st, var(--ok)); }
.bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--tick); }
.bar .tick.hit { background: var(--tick-hit); box-shadow: 0 0 4px var(--tick-hit); }
/* Drill outcome pops (issue #95): a "+x" floating up over the monster on the stage, styled by the drill tier */
.dpop { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none; --o: 0 0 2px var(--shade), 1px 1px 0 var(--shade), -1px 1px 0 var(--shade), 1px -1px 0 var(--shade), -1px -1px 0 var(--shade); }
.dpop.fail { font: 600 30px/1 var(--font-hand); color: var(--fail-ink); text-shadow: var(--o), 0 3px 6px color-mix(in srgb, var(--shade) 60%, transparent); animation: dpop-fail 1.6s ease-in both; }
.dpop.success { font: 700 26px/1 var(--font-display); color: var(--ok-pop); text-shadow: var(--o), 0 0 10px color-mix(in srgb, var(--ok) 70%, transparent); animation: dpop-ok 1.4s ease-out both; }
.dpop.super { font: 400 46px/1 var(--font-comic); letter-spacing: .04em; color: var(--gold); -webkit-text-stroke: 1px var(--gold-stroke);
  text-shadow: 3px 3px 0 var(--pop-red), 0 0 16px color-mix(in srgb, var(--gold) 85%, transparent); z-index: 1; animation: dpop-super 1.9s cubic-bezier(.2,.8,.3,1) both; }
@keyframes dpop-fail { 0% { opacity: 0; transform: translate(-50%, -40%) rotate(0); } 15% { opacity: .95; transform: translate(-50%, -70%) rotate(-3deg); }
  60% { opacity: .85; transform: translate(-50%, -55%) rotate(6deg); } 100% { opacity: 0; transform: translate(-50%, -20%) rotate(10deg); } }
@keyframes dpop-ok { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
  30% { transform: translate(-50%, -70%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -170%) scale(1); } }
@keyframes dpop-super { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(-12deg); } 12% { opacity: 1; transform: translate(-50%, -70%) scale(1.5) rotate(6deg); }
  20% { transform: translate(-50%, -70%) scale(.95) rotate(-5deg); } 28% { transform: translate(-50%, -75%) scale(1.15) rotate(4deg); }
  34% { transform: translate(-47%, -78%) scale(1.05) rotate(-3deg); } 40% { transform: translate(-53%, -80%) scale(1.1) rotate(2deg); }
  46% { transform: translate(-50%, -82%) scale(1.05) rotate(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -190%) scale(1.05); } }
.dtile.flash.t-super { animation: flash-super .9s ease-out; }
@keyframes flash-super { from { background: var(--gold-bg); box-shadow: inset 0 0 0 2px var(--gold); } }
.dtile.flash.t-fail { animation: flash-fail .6s ease-out; }
@keyframes flash-fail { from { background: var(--fail-bg); } }
.flash { animation: flash var(--dur-slow) ease-out; }
@keyframes flash { from { background: var(--ok-flash); } }
.result { display: flex; flex-direction: column; gap: 2px; }
.result b { font-family: var(--font-display); }
.super { color: var(--gold); } .fail { color: var(--bad); }

/* Trees */
.node { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: start; padding: 6px 0; border-top: 1px solid var(--line-soft); }
.node:first-of-type { border-top: 0; }
.node .chk { width: 16px; height: 16px; border-radius: var(--r-xs); border: 1px solid var(--line); margin-top: 2px; }
.node.got .chk { background: var(--ok); border-color: var(--ok); }
.node.got { color: var(--muted); }
.node .nm { font-weight: 600; }
.node .ds { font-size: 12px; color: var(--muted); }
.node.last .nm::after { content: ' \2605  chase trait'; color: var(--gold); font-size: 11px; }
.cond { font-size: 13px; display: flex; gap: 8px; }
.cond.met { color: var(--ok); }
.src { margin-top: 2px; }
.slotcard.empty { border-style: dashed; color: var(--muted); }
/* The rank ladder (specs/14 section 5): one rung per rank, top rank first; the next fight stands out, beaten rungs fade. */
.grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.grow > .row.between { align-self: stretch; }
.ladder { display: flex; flex-direction: column; gap: 8px; }
.rung { flex-direction: row; align-items: center; gap: 10px; padding: 10px; }
.rung .letter { font: 700 22px var(--font-display); width: 22px; text-align: center; flex: none; color: var(--muted); }
.rung .sprite { width: 48px; height: 48px; }
.rung.current { border-color: var(--gems); box-shadow: 0 0 0 1px var(--gems) inset; }
.rung.current .letter { color: var(--gems); }
.rung.beaten { opacity: .62; }
.rung.beaten .letter { color: var(--ok); }
.rung.boss .letter { color: var(--gold); }
.oppskills { display: flex; flex-wrap: wrap; gap: 4px; }
.rankbtn { color: var(--text); cursor: pointer; }
.unithead { gap: 6px; min-width: 0; }
.unithead b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sprite.art { image-rendering: auto; object-fit: contain; }
.sprite.small { width: 32px; height: 32px; padding: 2px; border-radius: var(--r-sm); }

/* Tree offers as a card pick: a banner, compact tree cards (node path, boost chips, perks), big slot tiles on the picked card. */
.st-hp { --st: var(--st-hp); } .st-str { --st: var(--st-str); } .st-int { --st: var(--st-int); } .st-wis { --st: var(--st-wis); }
.st-dex { --st: var(--st-dex); } .st-def { --st: var(--st-def); } .st-spd { --st: var(--st-spd); } .st-luk { --st: var(--st-luk); }
.obanner { position: relative; text-align: center; padding: 14px 10px 12px; border-radius: var(--r-xl); overflow: hidden; border: 2px solid var(--gold);
  background: radial-gradient(circle at 50% 120%, color-mix(in srgb, var(--gold) 28%, transparent), transparent 60%), repeating-conic-gradient(from 0deg at 50% 110%, color-mix(in srgb, var(--gold) 10%, transparent) 0 6deg, transparent 6deg 14deg), var(--gold-deep); }
.obanner.book { border-color: var(--gems); background: radial-gradient(circle at 50% 120%, color-mix(in srgb, var(--gems) 28%, transparent), transparent 60%), repeating-conic-gradient(from 0deg at 50% 110%, color-mix(in srgb, var(--gems) 10%, transparent) 0 6deg, transparent 6deg 14deg), var(--gems-deep); }
.obanner.chase { border-color: var(--epic); background: radial-gradient(circle at 50% 120%, color-mix(in srgb, var(--epic) 32%, transparent), transparent 60%), repeating-conic-gradient(from 0deg at 50% 110%, color-mix(in srgb, var(--epic) 12%, transparent) 0 6deg, transparent 6deg 14deg), var(--epic-deep); }
.obanner .big { font: 400 40px/1 var(--font-comic); letter-spacing: .05em; color: var(--gold); -webkit-text-stroke: 1px var(--gold-stroke); text-shadow: 3px 3px 0 var(--pop-red), 0 0 18px color-mix(in srgb, var(--gold) 60%, transparent); }
.obanner.book .big { color: var(--gems-light); -webkit-text-stroke-color: var(--gems-stroke); text-shadow: 3px 3px 0 var(--gems-shadow), 0 0 18px color-mix(in srgb, var(--gems) 60%, transparent); }
.obanner.chase .big { color: var(--epic-light); -webkit-text-stroke-color: var(--epic-stroke); text-shadow: 3px 3px 0 var(--epic-shadow), 0 0 18px color-mix(in srgb, var(--epic) 70%, transparent); }
.obanner .sub { margin-top: 6px; font: 600 14px var(--font-display); }
.obanner .more { position: absolute; top: 8px; right: 8px; font: 700 11px var(--font-display); padding: 2px 7px; border-radius: var(--r-lg); background: color-mix(in srgb, var(--shade) 50%, transparent); border: 1px solid var(--line); }
.obanner.anim .big { animation: obig .6s cubic-bezier(.2,.8,.3,1.3) both; }
@keyframes obig { from { opacity: 0; transform: scale(.3) rotate(-8deg); } 60% { opacity: 1; transform: scale(1.12) rotate(2deg); } }
.stchip { display: inline-block; padding: 0 6px; border-radius: var(--r-xs); background: var(--st); color: var(--on-st); font: 700 13px/1.5 var(--font-display); }
.tcard { position: relative; background: var(--panel); border: 2px solid var(--line); border-radius: var(--r-xl); padding: 12px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: var(--shadow-key); cursor: pointer; transition: transform var(--dur-fast), border-color var(--dur-fast); }
.tcard:not(.sel):active { transform: translateY(2px); box-shadow: var(--shadow-key-down); }
.tcard.sel { cursor: default; border-color: var(--gems); box-shadow: 0 4px 0 var(--gems-keycap), 0 0 18px color-mix(in srgb, var(--gems) 25%, transparent); }
.tcard:not(.sel) { opacity: .82; }
.tcard .tname { font: 700 18px var(--font-display); }
.tcard .kind { text-transform: uppercase; }
.tcard.k-chase .kind { color: var(--epic); border-color: var(--epic); } .tcard.k-book .kind { color: var(--gems); border-color: var(--gems); }
.npath { position: relative; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.npath::before { content: ''; position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: var(--line); }
.nt { position: relative; aspect-ratio: 1; max-width: 40px; width: 100%; justify-self: center; border-radius: var(--r); display: grid; place-items: center; cursor: help;
  font: 700 11px var(--font-display); background: var(--tile); border: 2px solid var(--line); }
.nt[data-tip] { text-decoration: none; }
.nt[aria-expanded="true"] { outline: 2px solid var(--text); outline-offset: 2px; }
.nt .f, .nt .m { grid-area: 1 / 1; }
.nt.fill { border-color: var(--st); color: var(--st); background: color-mix(in srgb, var(--st) 14%, var(--tile-mix)); }
.nt.fill .m { align-self: start; justify-self: end; margin: -4px -2px 0 0; font-size: 10px; }
.nt.sk { background: hsl(var(--hue, 200), var(--skill-bg)); border-color: hsl(var(--hue, 200), var(--skill-edge)); color: var(--text); font-size: 12px; transform: rotate(45deg) scale(.86); border-radius: var(--r-sm); }
.nt.sk .f { transform: rotate(-45deg); }
.nt.cap { background: radial-gradient(circle, var(--gold-mid), var(--gold-dark)); border-color: var(--gold); color: var(--gold); font-size: 18px; box-shadow: 0 0 10px color-mix(in srgb, var(--gold) 50%, transparent); }
/* The same path on a slotted tree (Trees tab, issue #115): bought tiles lit, every unbought one dimmed, the next one to buy a plain grey tile with an outline.
   A dimmed tile stays opaque and fades under a panel-coloured veil instead of opacity, so the path line stays hidden behind it. */
.npath.prog .nt { filter: saturate(.35); box-shadow: none; }
.npath.prog .nt::after { content: ''; position: absolute; inset: -2px; border-radius: inherit; background: var(--panel); opacity: .62; pointer-events: none; }
.npath.prog .nt.got::after, .npath.prog .nt.next::after { content: none; }
.npath.prog .nt:not(.got):not(.next) .m { position: relative; z-index: 1; opacity: .38; }   /* the corner mark pokes past the veil: fade it on its own */
.npath.prog .nt.got { filter: none; box-shadow: 0 0 8px color-mix(in srgb, currentColor 55%, transparent); }
.npath.prog .nt.next { filter: none; color: var(--muted); border-color: var(--line); background: var(--tile); box-shadow: none; outline: 2px dashed var(--accent); outline-offset: 2px; }   /* not bought yet: a plain grey tile, only the outline marks it */
.npath.prog .nt[aria-expanded="true"] { outline: 2px solid var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.bchip { display: inline-flex; gap: 5px; align-items: baseline; padding: 3px 8px; border-radius: var(--r-sm); border: 1px solid var(--st); background: color-mix(in srgb, var(--st) 12%, transparent); font: 600 13px var(--font-display); }
.bchip > b { color: var(--st); }
.perks { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.perk { display: grid; grid-template-columns: 18px 1fr; gap: 6px; }
.perk .pg { color: var(--gems); text-align: center; }
.perk.cap { color: var(--gold); } .perk.cap .pg { color: var(--gold); }
.slotgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.stile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 76px; padding: 6px 7px 8px; text-align: left;
  border: 2px solid var(--line); border-radius: var(--r-lg); background: var(--panel-2); box-shadow: var(--shadow-key); min-width: 0; }
.stile:active { transform: translateY(2px); box-shadow: var(--shadow-key-down); }
.stile .sn { font-size: 20px; line-height: 1; font-weight: 700; color: var(--muted); }
.stile .sl { font-weight: 600; font-size: 12px; line-height: 1.2; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.stile .sw { margin-top: auto; font-size: 11px; color: var(--muted); }
.stile.empty { border-color: var(--ok); background: var(--ok-bg-2); box-shadow: 0 4px 0 var(--ok-keycap); }
.stile.empty .sn, .stile.empty .sw { color: var(--ok); }
.stile.full .sw { color: var(--warn); }
.stile.risky { border-color: var(--bad); } .stile.full.risky .sw { color: var(--bad); }
.btn.ghost { background: transparent; border-style: dashed; color: var(--muted); }
.linkish { align-self: flex-start; border: 0; background: none; padding: 4px 0; color: var(--gems); font-size: 13px; font-weight: 600; min-height: 32px; }
@media (prefers-reduced-motion: reduce) { .tcard, .stile { transition: none; } }

/* Layers */
#modal > *, #account-sheet > * { flex-shrink: 0; }
#account-sheet p { margin: 0; overflow-wrap: anywhere; }
.google-slot { min-height: 44px; }
#modal, #account-sheet { position: absolute; inset: 0; background: var(--scrim); padding: 14px var(--gutter-r) 14px var(--gutter-l); overflow-y: auto; z-index: 5; display: flex; flex-direction: column; gap: 12px; }
#account-sheet { z-index: 8; }
.units { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.unit { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.unit .bar .fill { background: var(--ok); } .unit.foe .bar .fill { background: var(--bad); }
/* Fight playback (issue #79): skill tiles with cooldowns, the current action, the speed toggle.
   A tile's grey overlay covers it while on cooldown and recedes downward as the cooldown runs out (issue #85). */
.unit .bar .fill { transition: width var(--dur) ease-out; }
.skills { display: flex; flex-wrap: wrap; gap: 6px; }
.skill { width: 52px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; }
.skill .tile { position: relative; width: 48px; height: 48px; border: 2px solid var(--line); border-radius: var(--r); overflow: hidden; background: hsl(var(--hue, 200), var(--skill-tile)); display: grid; place-items: center; }
.skill .cdfill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--cd-veil); transition: height var(--dur) ease-out; }
.skill .ab, .skill .st { grid-area: 1 / 1; position: relative; }
.skill .ab { font: 700 16px var(--font-display); letter-spacing: .02em; color: var(--text); }
.skill .st { font: 700 20px var(--font-display); color: var(--text); text-shadow: 0 1px 3px var(--shade); }
.skill .st:empty { display: none; }
.skill:not(.ready) .ab { align-self: start; margin-top: 2px; font-size: 10px; color: var(--muted); }
.skill .nm { max-width: 100%; font-weight: 600; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skill.ready .tile { border-color: var(--ok); }
.skill.used .tile { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); animation: used .45s ease-out; }
@keyframes used { from { background: var(--gold-bg-2); } }
.now { min-height: 72px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2px; }
.now b { font: 700 20px var(--font-display); animation: pop .25s ease-out; }
.now.you { border-color: var(--ok); } .now.you b { color: var(--ok); }
.now.foe { border-color: var(--bad); } .now.foe b { color: var(--foe-ink); }
@keyframes pop { from { transform: scale(1.15); opacity: .5; } }
/* Dungeon playback (issue #98): the boss side spans the row, each unit's entropy gauge and next vent, the corruption meter, event banners. */
.units.tower .unit.foe { grid-column: 1 / -1; }
.entrow { display: flex; align-items: center; gap: 4px; }
.entrow .bar { flex: 1; height: 12px; }
.entrow .bar span { font-size: 10px; line-height: 12px; }
.unit .bar.ent .fill, .unit.foe .bar.ent .fill { background: var(--epic); }
.entrow .vent { color: var(--gold); white-space: nowrap; }
.corrow { display: flex; align-items: center; gap: 6px; min-width: 150px; }
.corrow .bar { flex: 1; }
.bar.corrupt .fill { background: var(--warn); transition: width var(--dur) ease-out; }
.now.event { border-color: var(--gold); } .now.event b { color: var(--gold); }
.tipword { text-decoration: underline dotted; text-underline-offset: 2px; }
.tslot { min-height: 34px; } .tslot.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 0 10px; }
/* ---- Endless Tower screen (specs/28 section 9 step 5): Team / Floors / Board as a segmented switch (issue #130), a team slot on one
   row with its rule count under the name, the mutator list, the next floors with their squads, the climb's result, and the 4v4
   playback (no unit spans the row) with its mutators and rule-firing lines. */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-pill); }
.seg button { border: 0; background: none; padding: 8px 0; border-radius: var(--r-pill); font: 700 13px var(--font-display); color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--panel); color: var(--gems); box-shadow: var(--shadow-card); }
.card.enext { flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; text-align: left; }
.card.enext > .row { flex: 1; min-width: 0; justify-content: flex-start; }
.tslot-who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tslots .tslot + .tslot:not(.empty) { border-top: 1px solid var(--line-faint); padding-top: 6px; }
.emuts { display: flex; flex-direction: column; gap: 8px; }
.emut { padding: 6px 10px; border-left: 3px solid var(--line); border-radius: var(--r-xs); }
.emut.on { border-left-color: var(--epic); background: var(--epic-deep); }
.emut.on .tag { border-color: var(--epic); color: var(--epic-stroke); }
.efloors { display: flex; flex-direction: column; gap: 10px; }
.efloor { display: flex; flex-direction: column; gap: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--line-faint); }
.efloor:last-child, .efloors details > .efloor:last-child { border-bottom: 0; padding-bottom: 0; }
.efloors details { display: flex; flex-direction: column; gap: 10px; }
.efloors details > summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; }
.efloors details[open] > summary { margin-bottom: 6px; }

/* Rank fight hype screen (issue #126; 2026-11-03: it replaced the fight card and waits for a tap): the screen splits on a diagonal
   (the monster's side blue, the opponent's red), both slam in with their names, ranks and elements, a gold burst carries "VS" (it
   turns to "Fight!" for the beat after the tap). .anim plays the entrance once; .guard ignores taps while it lands (also with
   reduced motion); the screen clips everything sliding in, so it never widens the screen. */
#modal.bleed { padding: 0; gap: 0; }
.hype { position: relative; flex: 1 0 auto; min-height: 100%; overflow: hidden; outline: none; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
  gap: 8px; padding: 18px var(--gutter-r) 12px var(--gutter-l); background: var(--hype-bg); color: var(--hype-ink); }

.hyhalf.foe { background-color: var(--hype-foe); clip-path: polygon(0 56%, 100% 44%, 100% 100%, 0 100%); }
.hyslash { position: absolute; left: -10%; right: -10%; top: 50%; height: 7px; margin-top: -3px; background: var(--hype-ink); box-shadow: 0 0 16px var(--hype-ink); transform: rotate(-17deg); }
.hype > :not(.hyhalf):not(.hyslash) { position: relative; }
.hybanner { align-self: center; padding: 5px 16px; border-radius: var(--r-pill); background: var(--hype-stroke); color: var(--gold-pop); font: 700 14px var(--font-title); letter-spacing: .16em; text-transform: uppercase; }
.hyside { display: flex; align-items: center; gap: 8px; min-width: 0; transition: transform var(--dur) ease-out; }
.hyside.foe { flex-direction: row-reverse; }
.hyart { flex: 0 0 auto; }
/* three classes: beats the themed .sprite.art frame further down the sheet */
.hype .hyart .sprite { display: block; width: min(52vw, 210px); height: min(52vw, 210px); padding: 0; background: none; border: 0; filter: drop-shadow(0 6px 0 var(--hype-shadow)); }
.hyside.foe .hyart .sprite { transform: scaleX(-1); }   /* the opponent turns to face the monster */
.hyplate { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; }
.hyside.foe .hyplate { align-items: flex-start; text-align: left; }
.hyname { font: 700 30px/1.05 var(--font-title); color: var(--hype-ink); overflow-wrap: anywhere; text-transform: uppercase;
  -webkit-text-stroke: 2px var(--hype-stroke); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--hype-stroke); }
.hytag { font: 800 12px var(--font-body); padding: 2px 10px; border-radius: var(--r-pill); background: var(--hype-ink); color: var(--hype-stroke); }
.hymark { align-self: center; display: grid; place-items: center; width: 150px; height: 150px; margin-block: -40px; z-index: 1; pointer-events: none; }
.hymark::before { content: ''; grid-area: 1 / 1; width: 100%; height: 100%; background: var(--gold-pop); transform: rotate(10deg);
  clip-path: polygon(50% 0, 58% 31%, 85% 15%, 69% 42%, 100% 50%, 69% 58%, 85% 85%, 58% 69%, 50% 100%, 42% 69%, 15% 85%, 31% 58%, 0 50%, 31% 42%, 15% 15%, 42% 31%); }
.hymark span { grid-area: 1 / 1; position: relative; z-index: 1; white-space: nowrap; font: 700 60px/1 var(--font-title); color: var(--hype-ink); -webkit-text-stroke: 3px var(--hype-stroke); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--pop-red); }
.hype.go .hymark::before { opacity: 0; }
.hype.go .hymark span { font-size: 76px; color: var(--gold-pop); -webkit-text-stroke-color: var(--gold-stroke); transform: rotate(-6deg); animation: vs-go .35s cubic-bezier(.2, .8, .3, 1.3) both; }
.hype.go .hyside.you { transform: translateX(10px); } .hype.go .hyside.foe { transform: translateX(-10px); }
.hyfoot { display: flex; flex-direction: column; gap: 4px; }
.hystakes { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--panel); color: var(--text); }
.hype.guard { animation: hy-guard .4s steps(1, end); }
@keyframes hy-guard { from { pointer-events: none; } to { pointer-events: auto; } }
.hyfoot .linkish { align-self: center; min-height: 44px; color: var(--hype-ink); font-weight: 800; letter-spacing: .04em; }
.hyfoot .speed > span { color: var(--hype-ink); }
.hype.anim .hyhalf.you { animation: vs-in-l .35s cubic-bezier(.2, .8, .3, 1.1) both; }
.hype.anim .hyhalf.foe { animation: vs-in-r .35s cubic-bezier(.2, .8, .3, 1.1) both; }
.hype.anim .hyslash { animation: hy-slash .25s .2s ease-out both; }
.hype.anim .hyside.you { animation: vs-in-l .45s .1s cubic-bezier(.2, .8, .3, 1.2) both; }
.hype.anim .hyside.foe { animation: vs-in-r .45s .1s cubic-bezier(.2, .8, .3, 1.2) both; }
.hype.anim .hymark { animation: vs-pop .3s .45s cubic-bezier(.2, .8, .3, 1.3) both; }
.hype.anim::after { content: ''; position: absolute; inset: 0; background: var(--hype-flash); opacity: 0; pointer-events: none; animation: hy-flash .35s .5s ease-out; }   /* no fill: unseen until it fires */
@keyframes vs-in-l { from { opacity: 0; transform: translateX(-100%); } }
@keyframes vs-in-r { from { opacity: 0; transform: translateX(100%); } }
@keyframes vs-pop { from { opacity: 0; transform: scale(2.6); } }
@keyframes vs-go { from { opacity: 0; transform: scale(.3) rotate(-14deg); } 60% { opacity: 1; transform: scale(1.15) rotate(-3deg); } }
@keyframes hy-slash { from { transform: rotate(-17deg) scaleX(0); } }
@keyframes hy-flash { from { opacity: 1; } to { opacity: 0; } }
/* The rank fight on a stage (2026-11-02): the intro's face-off becomes the fight. Names and HP over each monster, the actor lunges,
   the one hit recoils under a floating number, the current action is called out at the stage's foot, the skill tiles sit below. */
.fstage { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 10px 10px 8px; border: 2px solid var(--fight); border-radius: var(--r-xl); overflow: hidden;
  background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--fight) 14%, transparent), transparent 62%), linear-gradient(var(--arena-top) 0 72%, var(--panel-2) 72%); box-shadow: var(--shadow-pop); }
.fstage.won { border-color: var(--ok); background: radial-gradient(circle at 30% 50%, color-mix(in srgb, var(--gold-pop) 35%, transparent), transparent 60%), linear-gradient(var(--arena-top) 0 72%, var(--panel-2) 72%); }
.fstage.lost { border-color: var(--line); }
.fstage .units { gap: 14px; }
.fstage .unit { min-width: 0; }
.fstage .unit.foe { align-items: flex-end; text-align: right; }
.fstage .uname { font: 700 16px/1.15 var(--font-title); color: var(--ok); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fstage .unit.foe .uname { color: var(--foe-ink); }
.fstage .unit .bar { width: 100%; }
.fstage .unit .bar .fill { background: var(--ok); }
.uart { position: relative; align-self: center; margin-top: 2px; transition: transform var(--dur-fast) ease-out, opacity var(--dur-fast), filter var(--dur-slow); }
.fstage .uart .sprite { display: block; width: min(36vw, 150px); height: min(36vw, 150px); padding: 0; background: none; border: 0; }
.unit.foe .uart .sprite { transform: scaleX(-1); }
.unit.acting .uart { transform: translateX(14px); } .unit.foe.acting .uart { transform: translateX(-14px); }
.unit.hit .uart { transform: translateX(-8px); opacity: .7; } .unit.foe.hit .uart { transform: translateX(8px); }
.unit.down .uart { filter: grayscale(1); opacity: .55; transform: translateY(14%) rotate(-70deg) scale(.85); }
.unit.foe.down .uart { transform: translateY(14%) rotate(70deg) scale(.85); }
.dmgfloat { position: absolute; left: 0; right: 0; top: 4px; text-align: center; pointer-events: none; }
.dmgfloat span { display: inline-block; font: 700 26px/1 var(--font-title); -webkit-text-stroke: 4px var(--panel); paint-order: stroke fill; animation: dmg-up .5s ease-out both; }
.dmgfloat .dmg { color: var(--bad); } .dmgfloat .crit { color: var(--warn); font-size: 34px; } .dmgfloat .heal { color: var(--ok); } .dmgfloat .miss { color: var(--muted); font-size: 20px; }
@keyframes dmg-up { from { opacity: 0; transform: translateY(12px) scale(.6); } 40% { opacity: 1; transform: translateY(-4px) scale(1.08); } }
.fstage .now { min-height: 0; padding: 6px 14px; align-self: center; max-width: 100%; border-width: 2px; box-shadow: var(--shadow-float); }
.fstage .now b { font-size: 18px; }
.fstage .stamp { position: absolute; left: 0; right: 0; top: 38%; text-align: center; pointer-events: none; transform: rotate(-6deg);
  font: 700 54px/1 var(--font-title); color: var(--gold-pop); -webkit-text-stroke: 3px var(--gold-stroke); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--pop-red); animation: vs-go .45s cubic-bezier(.2, .8, .3, 1.3) both; }
.fstage.lost .stamp { color: var(--fail-bg); -webkit-text-stroke-color: var(--fail-ink); text-shadow: 3px 3px 0 var(--fail-ink); }
.skillrows { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: var(--r); background: var(--panel); box-shadow: var(--shadow-card); }
.skillrow { display: flex; align-items: center; gap: 8px; }
.skillrow .who { flex: 0 0 34px; font: 800 11px var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--ok); }
.skillrow.foe .who { color: var(--foe-ink); }
.skillrow .skills { flex: 1; min-width: 0; }
.vsel { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: var(--r-sm); border: 1px solid; }
.vsel.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
.vsel.bad { color: var(--bad); border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--panel)); }

@media (prefers-reduced-motion: reduce) {
  .hype *, .hype::after, .dmgfloat span, .fstage .stamp { animation: none !important; }

}
.alog { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }

.grade { font: 700 96px/1 var(--font-display); text-align: center; }
.grade.s { color: var(--gold); } .grade.a { color: var(--epic); } .grade.b, .grade.c { color: var(--gems); }
.center { text-align: center; }
.species { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; text-align: left; }
.species.sel { border-color: var(--gems); box-shadow: 0 0 0 1px var(--gems); }

/* Post-run vendor (specs/18 section 4): rarity by tier */
.offer.r1 { border-color: var(--gems); } .offer.r1 .rarity { color: var(--gems); border-color: var(--gems); }
.offer.r2 { border-color: var(--epic); } .offer.r2 .rarity { color: var(--epic); border-color: var(--epic); }
.offer.r3, .offer.r4 { border-color: var(--gold); } .offer.r3 .rarity, .offer.r4 .rarity { color: var(--gold); border-color: var(--gold); }
.offer.sold { opacity: .55; }
/* The merchant's reveal (issue #108): face-down cards glow their tier's colour, then flip; epic and up burst, legendary shakes */
.offer { --tier: var(--muted); position: relative; }
.offer.r1 { --tier: var(--gems); } .offer.r2 { --tier: var(--epic); } .offer.r3, .offer.r4 { --tier: var(--gold); }
.offer.back { min-height: 92px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  background: repeating-linear-gradient(45deg, var(--panel-2), var(--panel-2) 8px, var(--panel) 8px, var(--panel) 16px); }
.offer.back .mark { font: 700 34px/1 var(--font-display); color: var(--muted); }
.offer.back.hint { border-color: var(--tier); animation: rv-glow .5s ease-in-out infinite alternate; }
.offer.back.hint .mark { color: var(--tier); }
@keyframes rv-glow { from { box-shadow: 0 0 0 0 var(--tier); } to { box-shadow: 0 0 18px 3px var(--tier); } }
.offer.flip { animation: rv-flip .38s ease-out both; }
@keyframes rv-flip { 0% { transform: perspective(600px) rotateY(90deg); } 60% { transform: perspective(600px) rotateY(-12deg) scale(1.03); } 100% { transform: none; } }
.offer.burst::after { content: ''; position: absolute; inset: -2px; border-radius: inherit; pointer-events: none;
  box-shadow: 0 0 0 0 var(--tier); animation: rv-burst .7s ease-out .2s both; }
@keyframes rv-burst { 0% { box-shadow: 0 0 0 0 var(--tier); opacity: 1; } 100% { box-shadow: 0 0 0 22px var(--tier); opacity: 0; } }
.offer.shake { animation: rv-flip .38s ease-out both, rv-shake .4s ease-in-out .38s 2; }
@keyframes rv-shake { 25% { transform: translateX(-5px) rotate(-1deg); } 75% { transform: translateX(5px) rotate(1deg); } }
.merchant { color: var(--muted); font-style: italic; }
@media (prefers-reduced-motion: reduce) { .offer.back.hint, .offer.flip, .offer.shake, .offer.burst::after { animation: none !important; } }
.ach { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line-soft); }
.ach:first-child { border-top: 0; }
.ach .chk { width: 18px; height: 18px; border-radius: var(--r-xs); border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; }
.ach.got .chk { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
.mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 8px; font-size: 12px; color: var(--muted); }
.mini b { color: var(--text); font-family: var(--font-display); }
.err { color: var(--bad); white-space: pre-wrap; }
/* Gauntlet wheel (specs/19): a slowing reel of the floors climbed, then a comic defeat */
.reel { --row: 48px; position: relative; height: calc(var(--row) * 5); overflow: hidden; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); cursor: pointer; touch-action: manipulation; user-select: none; }
.reel::before, .reel::after { content: ''; position: absolute; left: 0; right: 0; height: calc(var(--row) * 1.6); z-index: 2; pointer-events: none; }
.reel::before { top: 0; background: linear-gradient(var(--panel), transparent); }
.reel::after { bottom: 0; background: linear-gradient(transparent, var(--panel)); }
.reel .pointer { position: absolute; left: 0; right: 0; top: calc(var(--row) * 2); height: var(--row); border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); z-index: 3; pointer-events: none; }
.reel .pointer::before { content: '\25B6'; position: absolute; left: 5px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 11px; }
.strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.floor { height: var(--row); display: grid; grid-template-columns: 40px 32px 1fr auto; align-items: center; gap: 8px; padding: 0 12px 0 22px; border-bottom: 1px solid var(--line-soft); }
.floor .fl { font: 700 13px var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; }
.floor canvas { width: 32px; height: 32px; image-rendering: pixelated; image-rendering: crisp-edges; }
.floor .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.floor.boss .nm { color: var(--warn); }
.floor .mk { font: 700 14px var(--font-display); }
.floor.won .mk { color: var(--ok); }
.floor.fell.landed { background: color-mix(in srgb, var(--bad) 16%, transparent); } .floor.fell.landed .mk { color: var(--bad); }
.floor.summit .nm { color: var(--gold); }
.floor.unfought { opacity: .35; }
.climb-now { font: 700 22px var(--font-display); text-align: center; font-variant-numeric: tabular-nums; min-height: 30px; }
.arena { position: relative; height: 124px; display: flex; justify-content: space-around; align-items: flex-end; padding-bottom: 10px; overflow: hidden; border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(var(--arena-top), var(--panel)); }
.arena .fighter { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.arena .sprite { width: 64px; height: 64px; background: none; padding: 0; }
.arena .boss .sprite { width: 88px; height: 88px; }
.arena .squad { display: flex; gap: 4px; align-items: flex-end; }
.arena .team .sprite { width: 44px; height: 44px; }   /* a Dungeon or Endless team, up to 4 side by side */
.arena .you.launch .sprite { animation: launch 1.1s cubic-bezier(.3,.1,.7,1) .45s forwards; }
.arena .you.ash .sprite { animation: ash 1.4s ease-in .45s forwards; }

.arena .foe.strike .sprite { animation: lunge .55s ease-in-out .1s; }
@keyframes launch { to { transform: translate(-150px, -230px) rotate(-900deg) scale(.4); opacity: 0; } }
@keyframes ash { 25% { filter: grayscale(1) brightness(.5); } 100% { filter: grayscale(1) brightness(.35) blur(3px); transform: translateY(26px) scaleY(.12); opacity: 0; } }
@keyframes hop { 50% { transform: translateY(-26px); } }
@keyframes lunge { 45% { transform: translateX(-70px) rotate(-8deg); } }
.pow { position: absolute; left: 22%; top: 14%; font: 700 30px var(--font-display); color: var(--gold); text-shadow: 2px 2px 0 var(--pop-red); transform: rotate(-12deg); animation: pow 1s ease-out .4s both; pointer-events: none; }
@keyframes pow { 0% { opacity: 0; transform: scale(.2) rotate(-12deg); } 30% { opacity: 1; transform: scale(1.3) rotate(-12deg); } 100% { opacity: 0; transform: scale(1) rotate(-12deg); } }
.legacy { font: 700 20px/1.25 var(--font-display); color: var(--gold); text-align: center; text-wrap: balance; }
@media (prefers-reduced-motion: reduce) {
  .arena .sprite, .pow { animation: none !important; }

/* Vault browsing (issue #81): search, sort and filters over the list; detail and compare sheets in the modal */

/* ---- Skin: daylight (specs/26 section 4.1). A pale sky with soft clouds; every panel a white rounded card with a soft blue shadow;
   buttons are chunky keys that press down (a solid shadow under them); the tab bar is a row of pills. Colours come from :root only. */
body, #app { background: radial-gradient(ellipse 60% 90px at 18% 40px, var(--cloud), transparent 70%), radial-gradient(ellipse 45% 70px at 86% 90px, var(--cloud), transparent 70%),

#top { background: transparent; border-bottom: 0; padding-top: 12px; padding-bottom: 6px; }

.tcard.sel { box-shadow: 0 0 0 2px var(--gems), 0 4px 0 var(--gems-keycap); }
/* buttons: keys that press down */
.btn { font-family: var(--font-display); font-weight: 800; border-radius: var(--r-sm); background: var(--panel); color: var(--text); border-color: var(--keycap);

.btn.primary:not(:disabled):active { box-shadow: 0 1px 0 var(--ok-keycap); } .btn.gemsy:not(:disabled):active { box-shadow: 0 1px 0 var(--gems-stroke); }
.btn.warn:not(:disabled):active { box-shadow: 0 1px 0 var(--fight-keycap); }

.stile { border-width: 1px; }
.ochip { border-radius: var(--r-sm); }
.bar { border-radius: var(--r-pill); }
.bar span { font-weight: 800; }
.sprite:not(.art) { background: radial-gradient(circle at 50% 70%, var(--gems-bg), var(--panel-2) 70%); border: 1px solid var(--line-soft); }
.sprite.art { background: radial-gradient(circle at 50% 75%, var(--gems-bg), transparent 70%); border: 1px solid var(--line-soft); }
.hud .sprite, .species .sprite { border-radius: var(--r-lg); }
.grade { font-family: var(--font-title); font-weight: 700; }

.dpop.super, .obanner .big, .pow { color: var(--gold-pop); -webkit-text-stroke: 1.5px var(--gold-stroke); }

/* Dungeon loot (run.js towerLoot): a banner with rays (gold on a full clear) that slams in once per attempt (.anim), then a face-down

.loot { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 14px 10px 12px; border-radius: var(--r-xl); overflow: hidden;

.loot.clear .lhead .big { color: var(--gold-pop); -webkit-text-stroke: 1.5px var(--gold-stroke); text-shadow: 3px 3px 0 var(--pop-red), 0 0 18px color-mix(in srgb, var(--gold) 60%, transparent); }

.loot.anim .lhead .big { animation: obig .6s cubic-bezier(.2,.8,.3,1.3) both; }
.loot.anim .lhead .sub { animation: tin .4s ease-out .3s both; }

.lcards-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.lcards { align-self: stretch; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

.lgem { width: 24px; height: 24px; flex: none; transform: rotate(45deg); border-radius: 4px; margin: 4px 0;
  background: linear-gradient(135deg, var(--panel) 0 14%, var(--shield) 14% 46%, var(--gems) 46% 100%); box-shadow: inset -3px -3px 0 color-mix(in srgb, var(--text) 14%, transparent), var(--glow-gems); }
.lbook { position: relative; width: 28px; height: 34px; flex: none; border-radius: 3px 6px 6px 3px; background: linear-gradient(90deg, var(--epic-stroke) 0 20%, var(--epic) 20%);
  box-shadow: 0 0 12px color-mix(in srgb, var(--epic) 50%, transparent); }
.lbook::before { content: ''; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -3px; border-radius: 50%; background: var(--gold-pop); box-shadow: 0 0 6px var(--gold-pop); }
.lbook::after { content: ''; position: absolute; right: -3px; top: 3px; bottom: 3px; width: 4px; border-radius: 0 2px 2px 0; background: var(--panel); border: 1px solid var(--epic-shadow); }

.evolve { position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;

.evolve.done .evo-line b { display: block; font-size: 24px; color: var(--evo-spark); animation: obig .6s ease-out both; }

.evolve.flash .evo-flash { animation: evo-flash .9s ease-out both; }

<script>
// No text selection or long-press menu outside text fields (issue #123): CSS alone did not stop it on iOS
(() => {
  const editable = (t) => t instanceof Element && !!t.closest('input, textarea, select, [contenteditable]');
  document.addEventListener('selectstart', (e) => { if (!editable(e.target instanceof Element ? e.target : e.target.parentElement)) e.preventDefault(); });
  document.addEventListener('contextmenu', (e) => { if (!editable(e.target)) e.preventDefault(); });
})();
// Build stamp from web/wasm/build.sh (version, commit, dirty flag, date): shows at a glance whether this copy is current. "dev" without one.
(async () => {
  const el = document.getElementById('build');
  let t = 'dev';
  try {
    const r = await fetch('wasm/dist/build-info.json', { cache: 'no-store' });
    const b = r.ok ? await r.json() : null;
    if (b && b.commit) {
      t = (b.version ? 'v' + b.version + ' · ' : '') + b.commit + (b.dirty ? '+dirty' : '');
      if (b.built) el.title = 'Built ' + String(b.built).slice(0, 10) + ' from commit ' + b.commit;
    }
  } catch (e) { /* no stamp: stay "dev" */ }
  el.textContent = t;
})();
</script>
</body>
</html>
