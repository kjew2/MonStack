<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monster Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* One phone-height column: header, scrolling body, tab bar. Dark palette. */
:root {
  --bg: #121212; --panel: #1e1e1e; --panel-2: #262626; --line: #333333;
  --text: #eeeeee; --muted: #9e9e9e;
  --gold: #ffd54f; --gems: #4dd0e1; --ok: #66bb6a; --bad: #ef5350; --warn: #ffa726; --epic: #ab47bc;
  --font-display: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.35 var(--font-body); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible { outline: 2px solid var(--gems); outline-offset: 2px; }
a { color: var(--gems); }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .ok { color: var(--ok); } .bad { color: var(--bad); } .gold { color: var(--gold); } .gems { color: var(--gems); }
h2 { margin: 0; font: 600 18px var(--font-display); text-wrap: balance; }
h3 { margin: 0; font: 600 12px var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
small, .small { font-size: 12px; }

#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; background: var(--bg); }
#top { display: flex; align-items: center; gap: 10px; padding: 8px var(--gutter-r) 8px var(--gutter-l); background: var(--panel); border-bottom: 1px solid var(--line); }
#top .title { font: 700 16px var(--font-display); flex: 1; }
.link-btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 6px 10px; font-size: 13px; text-decoration: none; color: var(--text); white-space: nowrap; }
#main { flex: 1; min-height: 0; overflow-y: auto; padding: 12px var(--gutter-r) 20px var(--gutter-l); -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 12px; }
#tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel); border-top: 1px solid var(--line); padding: 0 var(--gutter-r) env(safe-area-inset-bottom, 0px) var(--gutter-l); }
#tabs button { position: relative; border: 0; background: none; padding: 12px 0 13px; font: 600 13px var(--font-display); letter-spacing: .04em; color: var(--muted); }
#tabs button[aria-selected="true"] { color: var(--text); box-shadow: inset 0 3px 0 var(--gems); }
.dot { position: absolute; top: 7px; right: 28%; width: 8px; height: 8px; border-radius: 50%; background: var(--gems); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.card.alert { border-color: var(--gems); }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 10px 14px; font-weight: 600; min-height: 44px; }
.btn.primary { background: #2e3b2e; border-color: var(--ok); }
.btn.gemsy { background: #1d3438; border-color: var(--gems); }
.btn.warn { background: #3b2e1d; border-color: var(--warn); }
.btn.small { min-height: 34px; padding: 6px 10px; font-size: 13px; }
.btn.block { width: 100%; }
.tag { font: 700 11px var(--font-display); letter-spacing: .06em; padding: 2px 6px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
.sprite { image-rendering: pixelated; image-rendering: crisp-edges; display: block; width: 56px; height: 56px; flex: none; border-radius: 8px; background: var(--panel-2); padding: 4px; }

/* HUD */
.hud { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; }
.hud .sprite { grid-row: span 2; }
.hud-line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; font-family: var(--font-display); font-weight: 600; }
.bar { position: relative; height: 16px; border-radius: 4px; background: #424242; overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--ok); }
.bar.energy .fill { background: var(--gems); }
.bar.low .fill { background: var(--bad); }
.bar span { position: relative; display: block; text-align: center; font: 600 11px/16px var(--font-display); text-shadow: 0 1px 2px #000; }
.pips { display: flex; gap: 5px; }
.pip { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--gems); }
.pip.full { background: var(--gems); }

/* Train */
.odds { font-size: 12px; color: var(--muted); }
.stat { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; }
.stat .lbl { font: 700 13px var(--font-display); }
.stat .meta { display: flex; flex-direction: column; gap: 3px; }
.stat .meta small { color: var(--muted); }
.stat .btn { min-width: 76px; }
.flash { animation: flash .5s ease-out; }
@keyframes flash { from { background: #2f4a33; } }
.result { display: flex; flex-direction: column; gap: 2px; }
.result b { font-family: var(--font-display); }
.super { color: var(--gold); } .fail { color: var(--bad); }

/* Trees */
.node { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: start; padding: 6px 0; border-top: 1px solid #2a2a2a; }
.node:first-of-type { border-top: 0; }
.node .chk { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line); margin-top: 2px; }
.node.got .chk { background: var(--ok); border-color: var(--ok); }
.node.got { color: var(--muted); }
.node .nm { font-weight: 600; }
.node .ds { font-size: 12px; color: var(--muted); }
.node.last .nm::after { content: ' \2605  chase trait'; color: var(--gold); font-size: 11px; }
.cond { font-size: 13px; display: flex; gap: 8px; }
.cond.met { color: var(--ok); }
.src { margin-top: 2px; }
.slotcard.empty { border-style: dashed; color: var(--muted); }

/* Layers */
#modal { position: absolute; inset: 0; background: rgba(10,10,10,.94); padding: 14px var(--gutter-r) 14px var(--gutter-l); overflow-y: auto; z-index: 5; display: flex; flex-direction: column; gap: 12px; }
.units { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.unit { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.unit .bar .fill { background: var(--ok); } .unit.foe .bar .fill { background: var(--bad); }
.alog { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
.alog li { padding: 2px 0; border-bottom: 1px solid #222; }
.alog .you { color: var(--ok); } .alog .foe { color: #ef9a9a; }
.grade { font: 700 96px/1 var(--font-display); text-align: center; }
.grade.s { color: var(--gold); } .grade.a { color: var(--epic); } .grade.b, .grade.c { color: var(--gems); }
.center { text-align: center; }
.species { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; text-align: left; }
.species.sel { border-color: var(--gems); box-shadow: 0 0 0 1px var(--gems); }
.mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 8px; font-size: 12px; color: var(--muted); }
.mini b { color: var(--text); font-family: var(--font-display); }
.err { color: var(--bad); white-space: pre-wrap; }
#toasts { position: absolute; left: 12px; right: 12px; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 10; }
.toast { padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; background: #333; box-shadow: 0 4px 12px rgba(0,0,0,.5); animation: tin .2s ease-out; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .flash, .toast { animation: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <span class="title">Monster Trainer</span>
  </header>
  <main id="main"><p class="muted">Loading the C# engine...</p></main>
  <nav id="tabs" role="tablist" hidden></nav>
  <div id="modal" hidden></div>
  <div id="toasts" aria-live="polite"></div>
</div>
<script src="engine.js"></script>
<script src="run-engine.js"></script>
<script src="sprites.js"></script>
<script src="tooltips.js"></script>
<script src="run.js"></script>
</body>
</html>
